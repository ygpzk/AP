<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<!-- la guardia della manutenzione (manutenzione/guardia.js): finché dura, del sito si vede solo il cartello -->
<script src="/manutenzione/guardia.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutschland: l'album del viaggio con JMA</title>
<!-- Deutschland (9.11.2026, rifatta la sera stessa: «Deutschland 2», l'album dei ricordi; la notte «Deutschland 3», il tavolo
     dei ricordi): le foto del viaggio a Monaco e
     Stoccarda con Mikas, Jonny e Jella (JMA), dietro una password. Dal muro ci si arriva dalla macchinetta delle sigarette
     (#automat-muro in index.html, deutschland/muro.js): la vernice cola giù (vernice.js), si arriva qui e il telo nero
     scende via. Qui (Deutschland 4, più sotto) la macchinetta gialla, la password sul foglietto, le 20 vetrinette: la
     mandano; dentro, il tavolo dei ricordi (galleria.js e i suoi moduli: tavolo, packung, album, mappa, visore, condividi) con le immagini che
     passano tutte da rete.js. Le foto NON stanno su Vercel: stanno sul pc di Alberto (o su Backblaze, cdn b2) e la pagina
     le chiede col biglietto che dà /api/deutschland. Niente canonical né sitemap: è una pagina privata -->
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="L'album del viaggio a Monaco e Stoccarda con JMA. Solo per chi sa la password.">
<meta name="author" content="Alberto Pecchini">
<meta name="theme-color" content="#0e0d0c">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- 13.11: da «Aggiungi alla schermata Home» dell'iPhone il muro si apre a tutto schermo, e la vernice della barra cola da sotto la tacca -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="pzkko">
<!-- il telo (vernice.js, scopri): chi arriva dal muro con la vernice appena colata (sessionStorage pzkko-vernice da meno
     di 15 s) trova la pagina nera, e il nero scende via appena è pronta; chi arriva da un link la vede e basta. Se per
     qualche motivo lo script non parte, il telo se ne va da solo dopo 4 s -->
<style>.telo{position:fixed;inset:0;z-index:2147483000;background:#0e0d0c;pointer-events:none}html.senza-telo .telo{display:none}</style>
<script>
(function () {
  var t = 0
  try { t = +sessionStorage.getItem('pzkko-vernice') || 0 } catch (e) {}
  if (!(Date.now() - t < 15000)) { document.documentElement.classList.add('senza-telo'); return }
  setTimeout(function () { var e = document.querySelector('.telo'); if (e) e.remove(); try { sessionStorage.removeItem('pzkko-vernice') } catch (x) {} }, 4000)
})()
</script>
<link rel="preload" href="/fonts/anton.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/barra/barra.css"><!-- la barra in alto con le sezioni (barra/barra.js) -->
<link rel="stylesheet" href="/barra/pagina.css"><!-- i caratteri delle pagine della barra (Anton, Special Elite) -->
<link rel="stylesheet" href="/deutschland/deutschland.css">
</head>
<body>
<div class="telo" aria-hidden="true"></div>
<main class="dl">
  <!-- ── l'ingresso: la via di Stoccarda ─────────────────────────────────────────────────────────────────────────────
       Deutschland 4 (10.11.2026, Alberto: «ricrea esattamente quello sfondo e questa macchinetta al posto di quell'inizio
       orribile e triste»): la via dove l'8.11 c'era la macchinetta gialla vera (vicino a Fangelsbachstraße), rifatta con
       nano-banana-pro su Replicate dalle foto del viaggio (tools/pzkko/deutschland/via.mjs; adesivi e marchi tutti
       inventati, il doppio della roba) e preparata da tools/pzkko/deutschland/automat.mjs (misure in muro-dati.js). La
       notte stessa (Alberto: «crea la macchinetta da zero frontalmente», «avvicinati di più», «fai fare tutto lì
       direttamente», «disabilita lo scroll e togli il piè di pagina»): una schermata sola e ferma, la macchinetta frontale
       grande al centro, la via intorno alla sua scala, il titolo una targa stradale, la password sul foglietto attaccato
       al muro (#accesso), le 20 vetrinette tasti veri (una vetrinetta = un pacchetto = il tavolo, e l'album del suo tag).
       Tutto in accesso.js. Niente piè di pagina in questa pagina. -->
  <section id="automat" class="automat" aria-labelledby="am-titolo">
    <!-- la via intorno, alla scala della macchinetta (accesso.js, disponi): una schermata sola, ferma -->
    <div class="via" aria-hidden="true">
      <img class="via-foto" id="via-foto" src="/art/deutschland/muro-2400.webp" srcset="/art/deutschland/muro-2400.webp 2400w, /art/deutschland/muro-4800.webp 4800w" sizes="(min-width:900px) 180vw, 400vw" alt="" width="5504" height="3072" decoding="async">
    </div>
    <!-- il titolo: una targa stradale di Stoccarda avvitata sul travertino -->
    <header class="targa">
      <h1 id="am-titolo" class="am-titolo">Deutschland</h1>
      <p class="am-sotto">München → Stuttgart · 6.–8. November 2026 · mit JMA</p>
    </header>
    <!-- la macchinetta, frontale, grande al centro: le 20 vetrinette sono i tasti (#am-vetrine) -->
    <div class="am-corpo" id="am-corpo">
      <img class="am-foto" src="/art/deutschland/automat-gelb-1400.webp" srcset="/art/deutschland/automat-gelb-800.webp 800w, /art/deutschland/automat-gelb-1400.webp 1400w" sizes="(min-width:900px) 80vh, 100vw" alt="la macchinetta gialla delle sigarette, piena di adesivi, sul muro" width="3195" height="4954" decoding="async" fetchpriority="high">
      <div class="am-lcd" id="am-lcd" aria-hidden="true"><span class="ac-led" id="ac-led">PASSWORT?</span></div>
      <div class="am-vetrine" id="am-vetrine" role="group" aria-label="le 20 vetrinette: il pacchetto che vuoi"></div>
      <p class="am-etichetta" id="am-etichetta" hidden aria-hidden="true"><b></b><span></span></p>
      <!-- il pacchetto che la macchinetta sputa dalla bocchetta, quello della vetrinetta scelta -->
      <img class="am-pacco" id="am-pacco" src="/art/deutschland/pacchi/alles.webp" alt="" width="60" height="99" hidden>
    </div>
    <!-- la password: un foglietto attaccato col nastro (sul computer al muro accanto, sul telefono sul piede) -->
    <form id="accesso" class="foglietto" autocomplete="off" novalidate>
      <p class="fo-titolo" id="fo-titolo">Passwort?</p>
      <label class="ac-campo">
        <span class="nascosto">la password</span>
        <input id="ac-password" class="ac-input" type="password" name="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="latin" placeholder="hier schreiben" aria-describedby="ac-stato" enterkeyhint="go">
        <button type="button" class="ac-occhio" id="ac-occhio" aria-label="mostra la password" aria-pressed="false" data-suono-no><span aria-hidden="true"></span></button>
      </label>
      <button type="submit" class="fo-los" id="fo-los">los ➜</button>
      <p id="ac-stato" class="ac-stato" role="status" aria-live="polite"></p>
      <p class="fo-nota">la controlla il pc di Alberto: se è spento, la macchinetta è spenta.</p>
    </form>
  </section>

  <!-- ── dentro: il tavolo dei ricordi (Deutschland 3, tavolo.js) ───────────────────────────────────────────────────────
       Alberto: «solo foto migliori appena apri», «sparse e messe a mano, non perfette», «le sigarette tra le foto», «come
       l'outro di Cars 2, con la carta vera e tutte le cose del viaggio». Un foglio di carta con i margini spessi a destra e
       a sinistra: le foto migliori (manifesto.migliori) sparse storte, i pacchetti di sigarette in mezzo, i meme del viaggio
       su post-it, sottobicchieri e scontrini, gli sticker. Un pacchetto apre il suo album sopra (#packung, packung.js). -->
  <section id="album" class="album" hidden aria-label="i ricordi del viaggio">
    <div class="al-barra" id="al-barra">
      <button type="button" class="segnale al-automat" data-azione="automat" title="torna alla macchinetta"><span aria-hidden="true">◂</span>Automat</button>
      <p class="al-titolo">Deutschland</p>
      <button type="button" class="segnale segnale-karte" data-azione="karte" aria-pressed="false" title="la mappa del viaggio"><svg class="ic-karte" viewBox="0 0 28 22" aria-hidden="true"><path d="M1 4l8-3 9 3 9-3v17l-9 3-9-3-8 3z" fill="#e9e1c6" stroke="#1c1a14" stroke-width="1.1" stroke-linejoin="round"/><path d="M9 1v17M18 4v17" stroke="#1c1a14" stroke-width=".7" opacity=".45"/><path d="M5 15c4-5 7-2 10-5s5-3 8-5" fill="none" stroke="#ffd400" stroke-width="2.6" stroke-linecap="round"/><path d="M5 15c4-5 7-2 10-5s5-3 8-5" fill="none" stroke="#1c1a14" stroke-width=".7" stroke-dasharray="1 2"/><circle cx="5" cy="15" r="2.1" fill="#dd0000"/><circle cx="23" cy="5" r="2.1" fill="#dd0000"/></svg>Karte</button>
      <p class="al-scaricato" id="al-scaricato" hidden><i></i><span></span></p>
    </div>
    <div id="tavolo" class="tavolo" role="list" aria-label="le foto migliori, i pacchetti e i ricordi"></div>
  </section>

  <!-- la mappa: un foglio di carta che entra dal lato destro (mappa.js; galleria.js la apre e la chiude), col velo dietro.
       Il tasto è UNO solo per volta: sul computer largo la cartina appuntata nel margine destro (#karte-linguetta), se no
       quella nella barra del tavolo -->
  <button type="button" class="segnale segnale-karte karte-linguetta" id="karte-linguetta" data-azione="karte" hidden title="la mappa del viaggio"><svg class="ic-karte" viewBox="0 0 28 22" aria-hidden="true"><path d="M1 4l8-3 9 3 9-3v17l-9 3-9-3-8 3z" fill="#e9e1c6" stroke="#1c1a14" stroke-width="1.1" stroke-linejoin="round"/><path d="M9 1v17M18 4v17" stroke="#1c1a14" stroke-width=".7" opacity=".45"/><path d="M5 15c4-5 7-2 10-5s5-3 8-5" fill="none" stroke="#ffd400" stroke-width="2.6" stroke-linecap="round"/><path d="M5 15c4-5 7-2 10-5s5-3 8-5" fill="none" stroke="#1c1a14" stroke-width=".7" stroke-dasharray="1 2"/><circle cx="5" cy="15" r="2.1" fill="#dd0000"/><circle cx="23" cy="5" r="2.1" fill="#dd0000"/></svg><span>Karte</span></button>
  <div class="karte-velo" id="karte-velo" hidden></div>
  <!-- (la quinta: una cornice fissa grande quanto lo schermo che taglia il foglio quando è fuori, se no sul telefono la pagina
       diventerebbe più larga dello schermo) -->
  <div class="karte-quinta">
  <aside id="mappa-foglio" class="mappa-foglio" aria-label="la mappa del viaggio" aria-hidden="true">
    <h2 class="mf-titolo" id="mf-titolo">München → Stuttgart</h2>
    <div id="mappa" class="mappa"></div>
    <div class="mf-piede">
      <ul class="mf-legenda" aria-label="legenda">
        <li class="lg-fatto">fatto</li><li class="lg-dopo">ancora da fare</li><li class="lg-tappa">tappa</li><li class="lg-gla">la GLA</li>
      </ul>
      <button type="button" class="segnale mf-tutto" data-azione="tutto">Tutto il viaggio</button>
      <button type="button" class="segnale segnale-gelb mf-chiudi" data-azione="chiudi-karte">Zurück</button>
    </div>
  </aside>
  </div>

  <!-- l'album di un pacchetto (o di un posto della mappa), sopra al tavolo (packung.js; dentro, album.js) -->
  <div id="packung" class="packung" hidden role="dialog" aria-modal="true" aria-labelledby="pk-nome">
    <header class="pk-testa">
      <span class="pk-scatola" id="pk-scatola" aria-hidden="true"><img class="pk-pacco" id="pk-pacco" alt="" width="40" height="64"></span>
      <div class="pk-titoli"><h2 class="pk-nome" id="pk-nome">JMA</h2><p class="pk-conta" id="pk-conta"></p></div>
      <div class="pk-tasti" role="toolbar" aria-label="l'album">
        <button type="button" class="segnale" data-azione="auswahl" aria-pressed="false" title="scegli più foto da salvare">Scegli foto</button>
        <button type="button" class="segnale segnale-gelb" data-azione="speichern" title="salva le foto scelte">Salva scelte</button>
        <button type="button" class="segnale segnale-karte" data-azione="karte" title="la mappa del viaggio"><svg class="ic-karte" viewBox="0 0 28 22" aria-hidden="true"><path d="M1 4l8-3 9 3 9-3v17l-9 3-9-3-8 3z" fill="#e9e1c6" stroke="#1c1a14" stroke-width="1.1" stroke-linejoin="round"/><path d="M9 1v17M18 4v17" stroke="#1c1a14" stroke-width=".7" opacity=".45"/><path d="M5 15c4-5 7-2 10-5s5-3 8-5" fill="none" stroke="#ffd400" stroke-width="2.6" stroke-linecap="round"/><path d="M5 15c4-5 7-2 10-5s5-3 8-5" fill="none" stroke="#1c1a14" stroke-width=".7" stroke-dasharray="1 2"/><circle cx="5" cy="15" r="2.1" fill="#dd0000"/><circle cx="23" cy="5" r="2.1" fill="#dd0000"/></svg>Karte</button>
      </div>
      <button type="button" class="segnale segnale-gelb pk-chiudi" data-azione="chiudi" title="torna al tavolo" aria-label="chiudi l'album, torna al tavolo"><span aria-hidden="true">✕</span></button>
    </header>
    <div class="pk-scorre" id="pk-scorre">
      <div id="pagine" class="al-pagine" role="list" aria-label="le foto del pacchetto, per giorno"></div>
    </div>
  </div>
  <dialog id="visore" class="visore" aria-label="la foto grande"></dialog>
  <div id="scelte" class="scelte" hidden role="toolbar" aria-label="le foto scelte"></div>
</main>
<script type="module" src="/barra/barra.js"></script>
<script type="module" src="/deutschland/accesso.js"></script>
<!-- gli stili del tavolo, dell'album e dei pacchetti: in fondo, così la macchinetta non li aspetta (galleria.js li aggiunge se mancano) -->
<link rel="stylesheet" href="/deutschland/galleria.css">
<link rel="stylesheet" href="/deutschland/pacchi.css">
</body>
</html>
