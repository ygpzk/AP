<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<!-- la guardia della manutenzione (manutenzione/guardia.js): finché dura, del sito si vede solo il cartello -->
<script src="/manutenzione/guardia.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutschland: le foto del viaggio con JMA</title>
<!-- Deutschland (9.11.2026): le foto del viaggio a Monaco e Stoccarda con Mikas, Jonny e Jella (JMA), dietro una password.
     Dal muro ci si arriva dalla macchinetta delle sigarette (#automat-muro in index.html, deutschland/muro.js): la vernice
     cola giù (vernice.js), si arriva qui e il telo nero scende via. Qui la macchinetta da vicino chiede la password
     (accesso.js, proiettata sul suo schermo); dentro, la galleria (galleria.js e i suoi moduli: griglia, mappa, visore,
     condividi, filtri). Le foto NON stanno su Vercel: stanno sul pc di Alberto (C:\pzkko-server\deutschland), e la pagina
     le chiede col biglietto che dà /api/deutschland. Niente canonical né sitemap: è una pagina privata -->
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Le foto del viaggio a Monaco e Stoccarda con JMA. Solo per chi sa la password.">
<meta name="author" content="Alberto Pecchini">
<meta name="theme-color" content="#0e0d0c">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- il telo (vernice.js, scopri): chi arriva dal muro con la vernice appena colata (sessionStorage pzkko-vernice da meno
     di 15 s) trova la pagina nera, e il nero scende via appena è pronta; chi arriva da un link la vede e basta. Se per
     qualche motivo lo script non parte, il telo se ne va da solo dopo 4 s -->
<style>.telo{position:fixed;inset:0;z-index:2147483000;background:#0e0d0c;pointer-events:none}html.senza-telo .telo{display:none}</style>
<script>
(function () {
  var t = 0
  try { t = +sessionStorage.getItem('pzkko-vernice') || 0 } catch (e) {}
  if (!(Date.now() - t < 15000)) { document.documentElement.classList.add('senza-telo'); return }
  setTimeout(function () { var e = document.querySelector('.telo'); if (e) e.remove(); try { sessionStorage.removeItem('pzkko-vernice') } catch (x) {} }, 4000)
})()
</script>
<link rel="preload" href="/fonts/anton.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/barra/barra.css"><!-- la barra in alto con le sezioni (barra/barra.js) -->
<link rel="stylesheet" href="/barra/pagina.css"><!-- i caratteri delle pagine della barra (Anton, Special Elite) -->
<link rel="stylesheet" href="/deutschland/deutschland.css">
</head>
<body>
<div class="telo" aria-hidden="true"></div>
<main class="dl">
  <!-- la macchinetta da vicino, con la password proiettata sul suo schermo (accesso.js). La foto è automat-grande.webp
       (gpt-image-2, tools/pzkko/deutschland/immagini.mjs; lo schermo verde è diventato nero e i suoi angoli stanno in
       muro-dati.js); per provare senza foto c'è automat-segnaposto.svg -->
  <section id="automat" class="automat" aria-labelledby="am-titolo">
    <h1 id="am-titolo" class="am-titolo">Deutschland</h1>
    <p class="am-sotto">Monaco e Stoccarda con JMA · novembre 2026</p>
    <div class="am-corpo">
      <img class="am-foto" src="/art/deutschland/automat-grande.webp" alt="una vecchia macchinetta tedesca delle sigarette, a muro" width="954" height="1338" decoding="async" fetchpriority="high">
      <div class="am-schermo" id="am-schermo">
        <form id="accesso" class="accesso" autocomplete="off" novalidate>
          <p class="ac-led" aria-hidden="true">PASSWORT</p>
          <label class="ac-campo">
            <span class="nascosto">la password</span>
            <input id="ac-password" class="ac-input" type="password" name="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="latin" placeholder="······" aria-describedby="ac-stato" enterkeyhint="go">
          </label>
          <p id="ac-stato" class="ac-stato" role="status" aria-live="polite"></p>
        </form>
      </div>
      <!-- la manopola: si tira (ziehen) per avere il pacchetto; qui manda la password. Sta sulla fila delle manopole
           della foto (muro-dati.js, manopola), fuori dallo schermo -->
      <button class="ac-ziehen" id="ac-ziehen" type="submit" form="accesso" data-suono-no aria-label="ziehen: manda la password"><span class="ac-manopola" aria-hidden="true"></span><span class="ac-scritta">ziehen</span></button>
    </div>
    <p class="am-nota">le foto stanno sul pc di Alberto: se è spento, la macchinetta è spenta.</p>
  </section>

  <!-- la galleria (galleria.js e i suoi moduli: li scrive l'altro cantiere, qui solo i contenitori del contratto) -->
  <section id="galleria" class="galleria" hidden aria-label="le foto del viaggio">
    <nav id="filtri" class="filtri" aria-label="i pacchetti: i filtri delle foto"></nav>
    <div class="scena">
      <div id="griglia" class="griglia-foto" role="list" aria-label="le foto"></div>
      <div id="mappa" class="mappa" aria-label="la mappa del viaggio"></div>
    </div>
  </section>
  <dialog id="visore" class="visore" aria-label="la foto grande"></dialog>
  <div id="scelte" class="scelte" hidden role="toolbar" aria-label="le foto scelte"></div>
</main>
<footer class="piede">© 2026 pzkko · fatto da <a href="https://www.albertopecchini.it">Alberto Pecchini</a> · le foto sono di chi c'era · <a href="/info/">info e copyright</a></footer>
<script type="module" src="/barra/barra.js"></script>
<script type="module" src="/deutschland/accesso.js"></script>
<!-- gli stili della galleria e dei pacchetti (dell'altro cantiere): in fondo, così la macchinetta non li aspetta -->
<link rel="stylesheet" href="/deutschland/galleria.css">
<link rel="stylesheet" href="/deutschland/pacchi.css">
</body>
</html>
