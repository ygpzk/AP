<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<!-- la guardia della manutenzione (manutenzione/guardia.js): finché dura, del sito si vede solo il cartello -->
<script src="/manutenzione/guardia.js"></script>
<!-- 27.10: X-Frame-Options SAMEORIGIN, per la cornice della musica (suono/cornice.js). Toccata anche per questo: i browser che tenevano la pagina in cache con DENY, al 304 senza intestazioni, continuavano a rifiutarla nel riquadro -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagina non trovata, pzkko</title>
<meta name="description" content="L'indirizzo non esiste o è cambiato. Torna alla home di pzkko.it.">
<meta name="robots" content="noindex">
<meta name="author" content="Alberto Pecchini">
<link rel="author" href="https://www.albertopecchini.it">
<meta name="theme-color" content="#0e0d0c">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- 13.11: da «Aggiungi alla schermata Home» dell'iPhone il muro si apre a tutto schermo, e la vernice della barra cola da sotto la tacca -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="pzkko">
<link rel="preload" href="/art/insegna.svg" as="image">
<link rel="preload" href="/art/muro.webp" as="image" fetchpriority="high">
<!-- i caratteri dei titoli dei volantini (pochi KB l'uno, solo le lettere che servono: tools/pzkko/caratteri.mjs, che
     riscrive queste righe); data-home: la storia e la 404, che si generano da questa pagina, non le tengono -->
<!-- caratteri: social -->
<!-- /caratteri: social -->
<link rel="stylesheet" href="/telefono/zero/zero.css" data-zero><!-- il cercapersone zero sul muro (telefono/zero/muro.js): le sue regole al primo disegno, 30.10 -->
<link rel="stylesheet" href="/barra/barra.css"><!-- la barra in alto con le sezioni (barra/barra.js) -->
<!-- Le scelte di chi guarda (window.pzkkoScelte), che la regia tiene nel browser: l'ora vera di Mantova o sempre giorno
     (pzkko-ora), il meteo vero o sempre sole (pzkko-meteo, per la chiocciolina del cercapersone).
     SOLO 2D (6.11.2026, Alberto: «sito bloccato solo in 2D», a chi entrava «le ventole del pc diventano un aereo»): la
     scena 3D non parte più, né dalla regia né con ?scena=1, e chi l'aveva accesa (pzkko-3d nel browser) torna al muro.
     La pagina non chiede più niente di suo (moduli, three.js, anteprime, pomodoro); i file restano in scena/ e in
     art/scena/, spenti. scena resta qui, sempre false, per chi lo legge (la regia) -->
<script>
(() => {
  const leggi = (k) => { try { return localStorage.getItem(k) } catch { return null } }
  const q = new URLSearchParams(location.search)
  window.pzkkoScelte = {
    scena: false,
    ora: leggi('pzkko-ora') === 'giorno' ? 'giorno' : 'vera',
    meteo: leggi('pzkko-meteo') === 'sole' ? 'sole' : 'vero',
    get tempo() { return this.meteo === 'vero' || q.has('meteo') ? null : 'sole' },
  }
})()
</script>
<style>
/* I caratteri dei volantini: Anton e Archivo Black (OFL), Special Elite e Permanent Marker (Apache 2.0), da Google Fonts, serviti da qui.
   Dal 21.10 anche quelli delle altre tipografie (le classi t-* e m-sale, sotto): Abril Fatface, Shrikhand, Bungee, Black Ops One,
   Rubik Mono One, Alfa Slab One (OFL) e Rock Salt (Apache 2.0); il browser li scarica solo se un volantino li usa. */
@font-face{font-family:"Anton";src:url(/fonts/anton.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Archivo Black";src:url(/fonts/archivo-black.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Special Elite";src:url(/fonts/special-elite.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Permanent Marker";src:url(/fonts/permanent-marker.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Fake Receipt";src:url(/fonts/fake-receipt.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Abril Fatface";src:url(/fonts/abril-fatface.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Shrikhand";src:url(/fonts/shrikhand.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Bungee";src:url(/fonts/bungee.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Black Ops One";src:url(/fonts/black-ops-one.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Rubik Mono One";src:url(/fonts/rubik-mono-one.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Alfa Slab One";src:url(/fonts/alfa-slab-one.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Rock Salt";src:url(/fonts/rock-salt.woff2) format("woff2");font-weight:400;font-display:swap}

:root{
  --pietra:#665d56; --pietra2:#58504a; --asfalto:#3a3937;
  --inchiostro:#161616; --inchiostro2:#3a3632;
  --marker:#111; --marker-rosso:#a50d25; --marker-blu:#1446a0;
  --fa:"Anton",Impact,"Arial Narrow Bold",sans-serif;
  --fb:"Archivo Black","Arial Black",sans-serif;
  --ft:"Special Elite","Courier New",monospace;
  --fm:"Permanent Marker","Comic Sans MS",cursive;
  --ombra:0 2px 3px rgba(0,0,0,.25),0 10px 18px -6px rgba(0,0,0,.45);
  --ombra-su:0 4px 6px rgba(0,0,0,.28),0 22px 30px -8px rgba(0,0,0,.5);
  --eo:cubic-bezier(.22,1,.36,1);
  --u:calc(100cqw / 1280);
  /* la sera: 0 = giorno, 1 = notte (lo script li regola sul tramonto di Mantova); --f-* = lo sfarfallio */
  --notte:0; --insegna:0; --lampioni:0; --f-insegna:1; --f-lampioni:1;
  /* le auto che passano: posizione e forza dei fari (0..1 della larghezza), colore, fanali rossi, neon sotto la scocca */
  --auto-x:.5; --auto-l:0; --auto-c:255,226,170; --freno:0; --freno-x:1.1; --neon-auto:0;
  color-scheme:light dark;
}

*,*::before,*::after{box-sizing:border-box}
html{background:var(--pietra);-webkit-text-size-adjust:100%;scrollbar-color:#8a8784 var(--pietra2)}
body{margin:0;min-height:100svh;color:var(--inchiostro);font:400 16px/1.4 var(--ft);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit}
a,button{touch-action:manipulation} /* (13.11) due tocchi svelti su iPhone non ingrandiscono la pagina */
::selection{background:#ffd400;color:#111}
:focus-visible{outline:3px solid #ffd400;outline-offset:3px}
h1,h2,h3,p,ul{margin:0}
img{display:block;max-width:100%;height:auto}

/* ── la strada: il muro del palazzo, la saracinesca, la soglia ────────── */
.strada{--stipite:clamp(10px,3vw,40px);position:relative;isolation:isolate;overflow:clip;background:
  radial-gradient(90% 520px at 50% 0%,rgba(255,250,240,.07),transparent 70%),
  linear-gradient(rgba(20,16,12,.32),transparent 90px),
  url(/art/intonaco.svg) 0 0/640px repeat,
  var(--pietra);padding:0 var(--stipite)}

/* l'insegna sopra la porta: un cassonetto disegnato in SVG (art/insegna.svg) con le lettere a scatola, le colature
   e la ruggine; l'h1 è il suo testo. Di sera si scurisce col resto, al tramonto si accendono i tubi al neon dentro
   le lettere (art/insegna-notte.svg, stessa tela, sovrapposta; dal 23.10 si scarica solo quando si accende: data-src,
   lo script) */
.portale{position:relative;z-index:32;padding:clamp(18px,3.2vw,40px) 0 0;display:flex;justify-content:center;pointer-events:none}
/* con la barra in alto (barra/barra.js, 26.10) l'insegna scende sotto di lei, con un po' d'aria */
html.con-barra .portale{padding-top:calc(var(--barra) + clamp(22px,3.4vw,48px))}
.portale h1{position:relative;margin:0;width:min(100%,840px)}
.insegna{position:relative;z-index:1;width:100%;filter:brightness(calc(1 - .55 * var(--notte)))}
/* Le luci che non ci sono non si disegnano (6.11): l'insegna accesa col suo alone e il suo cono (html.acceso), il velo
   della sera (html.sera), i fari, i fanali e i riflessi (html.auto) stanno a display:none finché lo script non li
   accende. Sono strati grandi quanto la strada o lo schermo, mescolati in screen e in multiply: lasciati lì trasparenti,
   la scheda grafica li componeva lo stesso a ogni fotogramma, di giorno, per niente. E lo sfarfallio dell'insegna
   (--f-insegna) si scrive solo qui, su .portale, non più su html: a ogni scrittura il browser ricalcolava lo stile di
   tutta la pagina */
.insegna.notte{position:absolute;inset:0;z-index:2;filter:none;opacity:calc(var(--insegna) * var(--f-insegna))}
.insegna.notte,.insegna-luce,.insegna-cono{display:none}
html.acceso .insegna.notte,html.acceso .insegna-luce,html.acceso .insegna-cono{display:block}
.insegna-luce{position:absolute;inset:-14% -6% 0;z-index:0;pointer-events:none;mix-blend-mode:screen;filter:blur(14px);background:radial-gradient(50% 46% at 50% 44%,rgba(255,214,150,.4),rgba(255,200,130,.12) 60%,transparent 78%);opacity:calc(var(--insegna) * var(--f-insegna))}
.insegna-cono{position:absolute;left:-18%;right:-18%;top:84%;height:min(60vh,520px);z-index:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(50% 100% at 50% 0%,rgba(255,220,170,.3),rgba(255,214,160,.08) 50%,transparent 75%);opacity:calc(var(--insegna) * var(--f-insegna))}

/* la saracinesca: la lamiera fotografata si ripete (una doga ogni 114 px della tela a 1600) */
.muro{position:relative;container-type:inline-size;max-width:1280px;margin:0 auto;isolation:isolate;
  box-shadow:inset 0 10px 14px -8px rgba(0,0,0,.7),inset 0 -8px 10px -8px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.5)}
/* (di sera si scurisce: un velo nero sopra la foto, nello stesso sfondo. Fino al 6.11 era un filtro brightness su tutta la
   parete, che anche a mezzogiorno, quando non cambia niente, costringeva la scheda grafica a ridisegnarla a parte) */
.muro::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(rgba(0,0,0,calc(.5 * var(--notte))),rgba(0,0,0,calc(.5 * var(--notte)))),url(/art/muro.webp) 0 0/2200px auto repeat #8e8e8a}
/* la sera cala su tutto: un velo blu notte in multiply */
.buio{display:none;position:absolute;inset:0;z-index:30;pointer-events:none;mix-blend-mode:multiply;background:#0a0d1c;opacity:calc(var(--notte) * .64)}
html.sera .buio{display:block}
/* i fari delle auto che passano in strada (screen sul muro e sui fogli), poi i fanali rossi dal lato in cui se ne vanno */
.fari,.freni,.neonauto{display:none;position:fixed;inset:0;z-index:33;pointer-events:none;mix-blend-mode:screen}
html.auto .fari,html.auto .freni,html.auto .neonauto,html.auto .riflessi{display:block}
.fari{opacity:var(--auto-l);background:radial-gradient(34% 62% at calc(var(--auto-x) * 100%) 68%,rgba(var(--auto-c),.95),rgba(var(--auto-c),.38) 36%,transparent 68%)}
.freni{opacity:var(--freno);background:radial-gradient(28% 52% at calc(var(--freno-x) * 100%) 70%,rgba(255,36,24,.95),rgba(255,30,20,.35) 40%,transparent 70%)}
.neonauto{opacity:var(--neon-auto);background:radial-gradient(44% 14% at calc(var(--auto-x) * 100%) 100%,rgba(40,220,255,.85),rgba(40,200,255,.3) 50%,transparent 75%)}
/* la condensa dei condizionatori: la goccia cade dal tubo sulla lamiera, uno spruzzo, e il rivolo resta */
.goccia,.spruzzo{position:absolute;left:0;top:0;z-index:34;pointer-events:none;opacity:0;will-change:transform}
.goccia{width:9px}
.spruzzo{width:26px}
/* le formiche: piccole, in giro per il muro */
.formica{position:absolute;left:0;top:0;width:11px;z-index:6;pointer-events:none;will-change:transform}
/* le mosche: si posano sul muro e sui fogli, si girano, si puliscono le zampe e volano via.
   Quattro foto della stessa mosca (posata, che si pulisce, due battiti d'ali) impilate col centro del
   corpo allineato (--ax/--ay, in px della foto); lo script mostra una foto alla volta (data-f) e muove
   il contenitore, scalato a ~14 px di corpo. L'ombra si allarga quando la mosca si stacca dal muro.
   (6.11: le foto sono quelle leggere, al 40% delle prime, art/leggere/: --ax, --ay, la scala K dello script e le ombre
   sono rifatti su quella misura, e a video non cambia niente) */
.mosca{position:absolute;left:0;top:0;width:0;height:0;z-index:6;pointer-events:none;will-change:transform;filter:drop-shadow(2px 3.6px 1.6px rgba(0,0,0,.45))}
.mosca.vola{filter:drop-shadow(18px 32px 8px rgba(0,0,0,.2))}
.mosca img{position:absolute;left:calc(-1px * var(--ax));top:calc(-1px * var(--ay));max-width:none;display:none}
.mosca[data-f="posata"] .m-posata,.mosca[data-f="zampe"] .m-zampe,.mosca[data-f="vola"] .m-vola,.mosca[data-f="vola2"] .m-vola2{display:block}
/* i riflessi sulla lamiera: la stessa foto, a contrasto alto, in screen, dove battono i fari (.riflessi, dentro .muro) */
.riflessi{display:none;position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:screen;background:url(/art/muro.webp) 0 0/2200px auto repeat;filter:grayscale(1) contrast(3.2) brightness(1.25);opacity:calc(.75 * var(--auto-l));
  -webkit-mask-image:radial-gradient(34% 100% at calc(var(--auto-x) * 100%) 50%,#000,transparent 70%);
  mask-image:radial-gradient(34% 100% at calc(var(--auto-x) * 100%) 50%,#000,transparent 70%)}
.parete{position:relative;height:calc(3320 * var(--u))}
.gruppo{display:contents}

/* ogni cosa sul muro è posizionata in 1280esimi (e in 390esimi sul telefono) */
.it{position:absolute;left:calc(var(--px) * var(--u));top:calc(var(--py) * var(--u));width:calc(var(--pw) * var(--u));--px:var(--x);--py:var(--y);--pw:var(--w);--pr:var(--r,0deg);transform:rotate(var(--pr))}
.tag{z-index:0;pointer-events:none;mix-blend-mode:multiply;opacity:.92}
.tag.chiaro{mix-blend-mode:normal;opacity:.95}
.man{z-index:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3)) drop-shadow(0 8px 14px rgba(0,0,0,.28))}
.pezzo{z-index:1;pointer-events:none}
.pezzo.vivo{pointer-events:auto} /* il wallet e il cercapersone (26.10): pezzi del muro da toccare */

/* ── le parole sprayate che danno il nome alle zone: graffiti veri (art/scritte/), sotto i fogli ── */
.spray{z-index:0;margin:0;scroll-margin-top:24px}
.spray img{mix-blend-mode:multiply;opacity:.95}
.spray.bianco img,.spray.chiaro img{mix-blend-mode:normal}

/* ── i volantini: carta fotografata, testo vero sopra ───────────────────── */
.vol{z-index:3;container-type:inline-size;isolation:isolate;aspect-ratio:var(--ar);display:flex;flex-direction:column;filter:drop-shadow(0 2px 3px rgba(0,0,0,.28)) drop-shadow(0 10px 16px rgba(0,0,0,.3));
  transition:transform .32s var(--eo),filter .32s var(--eo)}
.vol.sotto{z-index:2}
.foglio{position:absolute;inset:0;background:var(--carta) center/100% 100% no-repeat;transform:scaleX(var(--flip,1))}
.testo{position:relative;flex:1;display:flex;flex-direction:column;gap:2.2cqw;padding:var(--pad)}
.vol:has(.tagliandi) .testo{padding-bottom:var(--giu)}
.arte{width:var(--aw,62%);margin:0 auto;mix-blend-mode:multiply;flex:none;align-self:var(--aa,center)}
/* Nessuna scritta esce dal suo riquadro: il riquadro comanda, non la scritta. Le parole lunghe (link, nomi) vanno a capo
   (overflow-wrap); un titolo o un testo che non ci sta si rimpicciolisce (--fit, lo mette lo script «adatta» più sotto) */
.vol .testo{min-width:0;overflow-wrap:anywhere}
.vol h3,.vol .titolo{font:400 calc(max(calc(26px * var(--ts,1)),calc(18cqw * var(--ts,1))) * var(--fit,1))/.95 var(--fa);letter-spacing:.005em;color:var(--titolo,var(--inchiostro));text-wrap:balance}
.vol h3 a,.vol .titolo a{text-decoration:none}
.vol h3 a::after{content:"";position:absolute;inset:0;z-index:1}
.vol p{font:400 calc(max(12px,5.4cqw) * var(--fit,1))/1.28 var(--ft);color:var(--testo,var(--inchiostro))}
.vol .mano{font:400 calc(max(14px,7.2cqw) * var(--fit,1))/1.05 var(--fm);color:var(--marker-c,var(--marker));transform:rotate(-2deg);align-self:flex-start}
.vol .mano.vai{align-self:flex-end;transform:rotate(-4deg)}
.vol .freccia{display:inline-block;width:1.5em;height:.75em;vertical-align:-.1em;margin-left:.15em;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.vol .mano a{text-decoration:none}
.vol .handle{font:400 calc(max(13px,6cqw) * var(--fit,1))/1.1 var(--fm);color:var(--marker-c,var(--marker));margin-top:auto;overflow-wrap:anywhere;padding-bottom:2cqw}
/* Nessun titolo si spezza a metà parola (6.11, Alberto: «whatsapp va a capo con 1 p, non deve assolutamente succedere»).
   Succedeva perché .testo spezza le parole lunghe (i link) e il titolo lo ereditava: spezzato non sbordava mai, e lo
   script che rimpicciolisce («adatta») non se ne accorgeva. I titoli e le note a mano vanno a capo solo fra una parola e
   l'altra; se una parola non ci sta sborda, e «adatta» rimpicciolisce il foglio finché ci sta */
.vol h3,.vol .titolo,.vol .mano,.vol .pet-testa{overflow-wrap:normal;word-break:normal;hyphens:manual}

/* il foglio sotto il puntatore viene in primo piano: i nuovi coprono i vecchi, ma basta passarci sopra
   (sul telefono toccarlo: lo script gli mette .sopra) per tirare fuori quello di sotto. Vale anche per i
   manifesti degli altri, che però non portano da nessuna parte */
.man{transition:transform .32s var(--eo),filter .32s var(--eo)}
.vol.sopra,.man.sopra,.vol:focus-within{z-index:20}
@media (hover:hover){
  .vol:hover,.man:hover{z-index:20}
  .vol:hover,.man:hover{transform:rotate(var(--pr)) translateY(calc(-1 * var(--u)))}
  .man:hover{filter:drop-shadow(0 4px 5px rgba(0,0,0,.3)) drop-shadow(0 18px 22px rgba(0,0,0,.34))}
  .vol:has(h3 a:hover){transform:rotate(var(--pr)) translateY(calc(-1.6 * var(--u))) scale(1.015);filter:drop-shadow(0 4px 5px rgba(0,0,0,.3)) drop-shadow(0 26px 30px rgba(0,0,0,.36))}
  .vol:has(h3 a:hover) h3{text-decoration:underline;text-decoration-thickness:.08em;text-underline-offset:.1em}
}
.vol:has(h3 a:active){transform:rotate(var(--pr)) scale(.99)}
.vol:has(h3 a:focus-visible){outline:3px solid #ffd400;outline-offset:4px}
.vol h3 a:focus-visible{outline:none}
/* un manifesto che è un link: l'<a> non ha scatola sua (l'immagine è assoluta), il fuoco si vede sul manifesto */
.man-link:focus-visible{outline:none}
.man-link:focus-visible>.man{outline:3px solid #ffd400;outline-offset:3px;z-index:20}

/* i tagliandi da strappare: fette della stessa carta, col contatto scritto di traverso.
   Il foglio con i tagliandi scrive fra i bordi veri della carta e i tagliandi vanno da bordo a bordo. */
.vol:has(.tagliandi) .testo{padding-left:var(--el);padding-right:var(--er)}
.vol:has(.tagliandi) .testo>*:not(.tagliandi){margin-left:5cqw;margin-right:5cqw}
.tagliandi{position:relative;z-index:2;display:flex;margin:auto 0 0;height:max(44px,17cqw);padding:0}
.tagliandi button{appearance:none;flex:1 1 0;min-width:0;margin:0;padding:0;border:0;border-top:1px dashed rgba(0,0,0,.45);border-left:1px dashed rgba(0,0,0,.4);background:var(--carta) var(--bgpos) / var(--bgsize) no-repeat;cursor:pointer;position:relative;color:var(--marker-c,var(--marker));font:400 max(9px,3.6cqw)/1 var(--fm);
  writing-mode:vertical-rl;text-align:center;transform-origin:50% 0;transition:transform .55s cubic-bezier(.55,0,1,.45),opacity .5s ease}
.tagliandi button:first-child{border-left:0}
.tagliandi button span{display:block;transform:rotate(180deg);padding:8px 0;white-space:nowrap;overflow:hidden;max-height:100%}
.tagliandi button.via{visibility:hidden;pointer-events:none}
.tagliandi button.cade{transform:translateY(60%) rotate(14deg);opacity:0}
.tagliandi button:focus-visible{outline:3px solid #ffd400;outline-offset:-3px}
@media (hover:hover){.tagliandi button:hover{transform:translateY(2px) rotate(-1.5deg)}}
.copiato{position:absolute;left:50%;bottom:14%;z-index:3;transform:translateX(-50%) rotate(-6deg);font:400 max(16px,9cqw)/1 var(--fm);color:var(--marker-rosso);background:rgba(255,255,255,.85);padding:.2em .4em;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s ease}
.copiato.si{opacity:1}

/* le carte: ogni volantino sa che foglio ha sotto, la sua proporzione, dove sono i bordi veri del foglio
   (dentro il ritaglio c'è anche il nastro) e il margine in cui scrivere */
.c-bianco{--carta:url(/art/carta/bianco.webp);--ar:560/732;--el:10%;--er:11.1%;--pad:16.1cqw 16.1cqw 12.9cqw 15.0cqw;--giu:8.9cqw}
.c-giallo{--carta:url(/art/carta/giallo.webp);--ar:556/672;--el:2.3%;--er:5%;--pad:14.9cqw 11.0cqw 11.7cqw 8.3cqw;--giu:7.7cqw}
.c-kraft{--carta:url(/art/carta/kraft.webp);--ar:504/656;--el:2.2%;--er:3.4%;--pad:7.8cqw 8.4cqw 7.4cqw 7.2cqw;--giu:3.4cqw}
.c-giornale{--carta:url(/art/carta/giornale.webp);--ar:600/524;--el:4.7%;--er:3.5%;--pad:8.4cqw 7.5cqw 7.5cqw 9.7cqw;--giu:3.5cqw}
.c-arancio{--carta:url(/art/carta/arancio.webp);--ar:520/636;--el:10.6%;--er:7.9%;--pad:14.4cqw 12.9cqw 13.7cqw 15.6cqw;--giu:9.7cqw}
.c-verde{--carta:url(/art/carta/verde.webp);--ar:596/556;--el:11.6%;--er:10.1%;--pad:14.3cqw 15.1cqw 11.6cqw 16.6cqw;--giu:8.6cqw}
.c-crema{--carta:url(/art/carta/crema.webp);--ar:588/648;--el:10.9%;--er:8.2%;--pad:14.5cqw 13.2cqw 12.2cqw 15.9cqw;--giu:8.2cqw}
.c-lucido{--carta:url(/art/carta/lucido.webp);--ar:516/600;--el:1.9%;--er:7.6%;--pad:8.7cqw 12.6cqw 10.6cqw 7.9cqw;--giu:6.6cqw}
.c-azzurro{--carta:url(/art/carta/azzurro.webp);--ar:652/576;--el:7.5%;--er:5.2%;--pad:12.7cqw 11.2cqw 7.5cqw 12.5cqw;--giu:3.5cqw}
.flip{--flip:-1}

/* ── i volantini dei social (6.11): compatti. Il foglio è alto quanto la sua carta (--ar) e non cresce; dentro, dall'alto:
   l'illustrazione, che prende lo spazio che resta, il titolo nel suo carattere (--tf, una classe f-* per stamperia), il
   contatto a penna, i tagliandi. Tutto in cqw del volantino, senza minimi in pixel e senza script che misura: il foglio è
   lo stesso disegno a ogni grandezza (190 unità sul computer, 118 sul telefono, tre per riga), e le scritte stanno su una
   riga sola per costruzione (white-space:nowrap), con --tt e --th (la misura del titolo e del contatto, in cqw) scelte
   perché riempiano la colonna senza uscirne (tools/pzkko/scritte.mjs le misura nel browser e dice se una sborda). I
   caratteri sono a pezzi, solo le lettere che servono (tools/pzkko/caratteri.mjs riscrive le regole qui sotto) ── */
/* caratteri: social */
@font-face{font-family:"s-pacifico";src:url(/fonts/sub/s-pacifico.woff2?v=59befa29) format("woff2");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"s-rubik-glitch";src:url(/fonts/sub/s-rubik-glitch.woff2?v=c637f9b7) format("woff2");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"s-silkscreen";src:url(/fonts/sub/s-silkscreen.woff2?v=7dfcb7fd) format("woff2");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"s-titan-one";src:url(/fonts/sub/s-titan-one.woff2?v=aa1edccb) format("woff2");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"s-playfair";src:url(/fonts/sub/s-playfair.woff2?v=1040ffe3) format("woff2");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"s-ultra";src:url(/fonts/sub/s-ultra.woff2?v=5757fab5) format("woff2");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"s-mano";src:url(/fonts/sub/s-mano.woff2?v=d697bdaa) format("woff2");font-weight:400;font-style:normal;font-display:swap}
/* /caratteri: social */
.f-pacifico{--tf:"s-pacifico","Brush Script MT",cursive;--tl:1.3}
.f-glitch{--tf:"s-rubik-glitch",Impact,"Arial Black",sans-serif}
.f-pixel{--tf:"s-silkscreen","Lucida Console","Courier New",monospace}
.f-titan{--tf:"s-titan-one","Arial Rounded MT Bold","Arial Black",sans-serif}
.f-playfair{--tf:"s-playfair",Didot,"Bodoni MT",Georgia,serif}
.f-ultra{--tf:"s-ultra",Rockwell,"Arial Black",serif}
.vol.s .testo{gap:1.4cqw;padding:var(--pad);padding-left:var(--el);padding-right:var(--er);padding-bottom:var(--giu);overflow-wrap:normal}
.vol.s .testo>*:not(.tagliandi){margin-left:3cqw;margin-right:3cqw}
.vol.s .arte{flex:1 1 0;min-height:0;width:auto;max-width:none;object-fit:contain}
.vol.s h3{font:400 calc(var(--tt) * 1cqw)/var(--tl,1.06) var(--tf);letter-spacing:0;text-align:center;white-space:nowrap;text-wrap:nowrap;padding:0 .09em} /* (.09em: i corsivi sporgono dalla loro ultima lettera) */
.vol.s .handle{font:400 calc(var(--th) * 1cqw)/1 "s-mano","Patrick Hand","Comic Sans MS",cursive;text-align:center;white-space:nowrap;text-wrap:nowrap;margin-top:0;padding:0}
.vol.s .tagliandi{height:17cqw;margin-top:.8cqw}
.vol.s .tagliandi button{font:400 3.5cqw/1.08 "s-mano","Patrick Hand","Comic Sans MS",cursive}
.vol.s .tagliandi button span{padding:1.2cqw 0}
.vol.s .copiato{font:400 max(13px,11cqw)/1 "s-mano","Patrick Hand","Comic Sans MS",cursive;bottom:22%}
/* un titolo che c'è per chi legge la pagina con la voce, ma sul muro non si vede */
/* (col carattere di sistema: scritto nel carattere della pagina faceva scaricare Special Elite, 52 KB, per una parola che non si vede) */
.nascosto{position:absolute;width:1px;height:1px;margin:0;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;font:400 12px/1 sans-serif}

/* ── la petizione (22.10): un foglio stampato con la tabella, le firme vere scritte a mano sopra (petizione/firme.js sulla
   tela .pet-firme, in multiply come l'inchiostro) e le tre bic legate allo spago, attaccate sotto con lo scotch. Le righe
   sono alte --rh, dieci sul muro (le ultime dieci firme). Le colonne sono le stesse di COLONNE in firme.js. Il foglio che
   si avvicina per firmare è di petizione/petizione.css. Dal 6.11 sta in fondo alla saracinesca e SOPRA TUTTO (z-index 25,
   più del foglio sotto il puntatore): niente copre più le penne, che dondolano sempre ── */
.vol.petizione{z-index:25!important}
/* le scritte stampate della petizione sono sempre quelle: caratteri a pezzi (tools/pzkko/caratteri.mjs, ~12 KB invece di
   ~100), davanti al carattere intero, che arriva solo se serve una lettera in più (il foglio da vicino) */
/* caratteri: petizione */
@font-face{font-family:"p-anton";src:url(/fonts/sub/p-anton.woff2?v=775aca0c) format("woff2");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"p-special-elite";src:url(/fonts/sub/p-special-elite.woff2?v=cf2f4f40) format("woff2");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"p-marker";src:url(/fonts/sub/p-marker.woff2?v=4fc9dce7) format("woff2");font-weight:400;font-style:normal;font-display:block}
/* /caratteri: petizione */
.vol.petizione{--fa:"p-anton","Anton",Impact,"Arial Narrow Bold",sans-serif;--ft:"p-special-elite","Special Elite","Courier New",monospace;--fm:"p-marker","Permanent Marker","Comic Sans MS",cursive}
/* («firma anche tu» con la sua freccia su una riga sola: sul telefono la freccia andava a capo da sola) */
.petizione .mano{font-size:calc(5.6cqw * var(--fit,1));white-space:nowrap}
.petizione .testo{gap:1.5cqw}
.vol .pet-testa{font:400 max(8px,3.8cqw)/1 var(--ft);letter-spacing:.2em;text-transform:uppercase;text-align:center;color:var(--inchiostro2)}
.petizione h3{text-align:center}
.vol .pet-sotto{text-align:center;font-size:max(9px,4cqw);line-height:1.2}
.pet-tabella{position:relative;margin-top:.6cqw;border:max(1px,.32cqw) solid #2b2825}
.pet-intesta{display:grid;grid-template-columns:8fr 40fr 19fr 13fr 20fr;font:400 max(5px,2.9cqw)/1 var(--ft);letter-spacing:-.02em;color:var(--inchiostro2);background:rgba(43,40,37,.07);border-bottom:max(1px,.32cqw) solid #2b2825}
.pet-intesta span{padding:1.3cqw .8cqw;border-left:max(1px,.22cqw) solid #2b2825;white-space:nowrap;overflow:hidden}
.pet-intesta span:first-child{border-left:0}
.pet-righe{--rh:6.4cqw;--fl:max(.5px,.11cqw);position:relative;height:calc(var(--righe,10) * var(--rh));
  background:repeating-linear-gradient(to bottom,transparent 0 calc(var(--rh) - 2 * var(--fl)),rgba(43,40,37,.45) 0 var(--rh))}
.pet-righe::before{content:"";position:absolute;inset:0;opacity:.85;pointer-events:none;background:
  linear-gradient(90deg,transparent calc(8% - var(--fl)),#2b2825 0 calc(8% + var(--fl)),transparent 0),
  linear-gradient(90deg,transparent calc(48% - var(--fl)),#2b2825 0 calc(48% + var(--fl)),transparent 0),
  linear-gradient(90deg,transparent calc(67% - var(--fl)),#2b2825 0 calc(67% + var(--fl)),transparent 0),
  linear-gradient(90deg,transparent calc(80% - var(--fl)),#2b2825 0 calc(80% + var(--fl)),transparent 0)}
.pet-firme{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply;pointer-events:none}
/* lo scotch trasparente che tiene gli spaghi, poco sopra il bordo basso della carta */
.pet-scotch{position:absolute;left:47%;bottom:4.6%;width:31%;height:5cqw;transform:rotate(-1.5deg);pointer-events:none;opacity:.92;
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(232,230,220,.4) 45%,rgba(255,255,255,.55));box-shadow:inset 0 0 0 max(1px,.22cqw) rgba(255,255,255,.4),0 .15cqw .35cqw rgba(0,0,0,.1);
  clip-path:polygon(0 8%,2% 0,98% 4%,100% 14%,99% 30%,100% 52%,98.5% 74%,100% 92%,97% 100%,3% 96%,0 88%,1.5% 66%,0 44%,1.2% 24%)}
.pet-elenco{position:absolute;width:1px;height:1px;margin:0;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
/* le penne: appese allo spago sotto lo scotch, dondolano (lo script muove --a); il fusto è trasparente */
.pet-penne{position:absolute;inset:0;z-index:2;pointer-events:none}
.penna{position:absolute;top:91.5%;width:3cqw;margin-left:-1.5cqw;height:82cqw;transform-origin:50% 0;transform:rotate(var(--a,0deg));pointer-events:none}
.penna[data-penna="blu"]{left:53%}.penna[data-penna="nera"]{left:62.5%}.penna[data-penna="rossa"]{left:72%}
/* (lo spago è lungo quanto serve alla penna per arrivare a scrivere sull'ultima riga: 46cqw, ~20 cm; la penna 36cqw) */
.penna .spago{position:absolute;left:50%;top:0;width:max(1px,.36cqw);height:46.6cqw;transform:translateX(-50%);background:linear-gradient(90deg,#cfc8b6,#f6f2e8 50%,#c6bfad);border-radius:1px}
.penna img{position:absolute;left:50%;top:46cqw;width:auto;height:36cqw;max-width:none;transform:translateX(-50%);pointer-events:auto;cursor:pointer;filter:drop-shadow(.4cqw .8cqw .5cqw rgba(0,0,0,.28))}

/* ── sotto la saracinesca: la soglia di pietra ────────────────────────── */
.strada{padding-bottom:clamp(28px,4vw,56px)}

/* ── il telefono: tre volantini per riga (dal 6.11; prima due), larghi ~118 unità su 390 ─────────── */
@media (max-width:899px){
  :root{--u:calc(min(100cqw, 600px) / 390)}
  .parete{height:calc(3800 * var(--u));max-width:600px;margin:0 auto}
  .it{--px:var(--mx,var(--x));--py:var(--my,var(--y));--pw:var(--mw,var(--w));--pr:var(--mr,var(--r,0deg))}
  .spray{font-size:calc(40 * var(--u))}
  .vol h3{font-size:max(calc(22px * var(--ts,1)),calc(16cqw * var(--ts,1)))}
  .vol p{font-size:max(12px,5.6cqw)}
  .vol .handle{font-size:max(12px,6cqw)}
  .tagliandi{height:max(46px,17cqw)}
}

/* (senza script è sempre giorno: fino al 23.10 la notte seguiva il tema scuro del sistema; dal 23.10 la pagina parte
   sempre di giorno, e la sera di Mantova si sceglie nella regia, che senza script non c'è) */

@media (prefers-reduced-motion:reduce){
  .vol,.man,.tagliandi button,.copiato{transition:none}
  .tagliandi button.cade{transform:none;opacity:0}
}

/* ── i suoni della strada (suono/): un pezzo di nastro di carta in basso a sinistra, scritto a pennarello. Sta sopra
   la pagina, sotto la regia; senza Web Audio (o negli strumenti che fotografano la
   pagina) resta nascosto. Barrato quando è spento; le onde respirano quando suona davvero ── */
.suono{position:fixed;z-index:75;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:3px;
  height:42px;padding:0 17px 2px 13px;border:0;background:url(/art/nastro/carta-gommata.webp) center/100% 100% no-repeat;color:#1a1a1a;
  font:400 17px/1 "p-marker","Permanent Marker",var(--fb,cursive);transform:rotate(-4deg);filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:transform .2s cubic-bezier(.2,1.4,.4,1)}
.suono[hidden]{display:none}
.suono:hover{transform:rotate(-2deg) scale(1.06)}
.suono:focus-visible{outline:2px dashed #ffd400;outline-offset:3px}
.suono svg{width:30px;height:24px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.suono .s-muto,.suono[aria-pressed="false"] .s-onde{display:none}
.suono[aria-pressed="false"] .s-muto{display:inline}
.suono[aria-pressed="false"] span{text-decoration:line-through 2px}
.suono.va .s-onde{animation:onde 1.8s ease-in-out infinite}
@keyframes onde{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.suono,.suono:hover{transition:none}.suono.va .s-onde{animation:none}}


/* ── il tasto del wallet (22.10 notte; dal 23.10 sera un banner), sempre in alto a sinistra e alto come prima: una
   striscia di pelle cucita con la piastra d'acciaio e un pannello a led che dice sempre i $pzk; col cursore sopra ci
   scorrono tutti i dati del wallet, col clic si apre il portafoglio (la foto è art/wallet-banner/banner.webp,
   gpt-image-2; i led li accende wallet/banner.js, che si carica da solo appena la pagina è tranquilla; il portafoglio
   aperto, wallet.css). Il pannello sta sul vetro della foto, misurato sui profili di luce (792 × 214): dentro la cornice
   nera da x 62 a 713 e da y 63,5 a 154,5. Dal 26.10 non sta più sospeso in alto a sinistra: è un pezzo della parete
   (#wallet-muro, in cima alla prima pila), avvitato alla saracinesca (art/muro/viti.svg), e scorre col muro. Negli
   strumenti che fotografano la pagina i led restano spenti (navigator.webdriver; ?wallet li accende) ── */
.wallet-tasto{height:auto;aspect-ratio:792/214;padding:0;border:0;background:none;color:#e9e4d8;cursor:pointer;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.5)) drop-shadow(0 10px 14px rgba(0,0,0,.3));transition:transform .18s cubic-bezier(.2,1.4,.4,1);-webkit-tap-highlight-color:transparent}
.wallet-tasto img,.chat-tasto img.attacco{position:absolute;inset:0;width:100%;height:100%;max-width:none;pointer-events:none}
.wallet-tasto canvas,.wallet-tasto::after{position:absolute;left:7.828%;top:29.673%;width:82.197%;height:42.523%}
.wallet-tasto canvas{display:block;background:#040605}
/* il vetro sopra i led: un riflesso in diagonale e l'ombra della cornice */
.wallet-tasto::after{content:"";pointer-events:none;background:linear-gradient(172deg,rgba(255,255,255,.1),rgba(255,255,255,.035) 46%,rgba(255,255,255,0) 48%);box-shadow:inset 0 1px 3px rgba(0,0,0,.85),inset 0 -1px 2px rgba(0,0,0,.5)}
.wallet-tasto .wt-piu{position:absolute;left:50%;top:100%;margin-top:6px;transform:translateX(-50%);font:400 20px/1 "Fake Receipt",monospace;color:#46ff7d;text-shadow:0 0 8px rgba(70,255,125,.9),0 2px 3px rgba(0,0,0,.6);opacity:0;pointer-events:none;white-space:nowrap}
.wallet-tasto .wt-piu.va{animation:wt-piu 1.6s ease-out forwards}
@keyframes wt-piu{0%{opacity:0;transform:translate(-50%,6px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}
@media (hover:hover){.wallet-tasto:hover{scale:1.03}}
.wallet-tasto:active{scale:.97}
.wallet-tasto:focus-visible{outline:3px solid #ffd400;outline-offset:4px}
@media (prefers-reduced-motion:reduce){.wallet-tasto{transition:none}.wallet-tasto .wt-piu.va{animation-duration:.01s}}

/* ── il tasto della chat col bot (chat/), sotto il wallet: il cercapersone
   zero (dal 31.10 per tutti) col suo lcd, dove vive il tomodachi, una chiocciolina a pixel (chat/tomodachi.js); il led rosso lampeggia quando c'è un premio da riscuotere.
   Dal 26.10 è un pezzo della parete (#cercapersone-muro, in cima alla seconda pila); dal 31.10 per tutti lo zero, attaccato
   col nastro (telefono/zero/muro.js lo veste: la foto, pzk os sul vetro, il led). Negli strumenti che fotografano la pagina resta spento (navigator.webdriver; ?chat lo accende) ── */
.chat-tasto{height:auto;aspect-ratio:336/194;padding:0;border:0;background:none;cursor:pointer;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.5)) drop-shadow(0 10px 14px rgba(0,0,0,.3));transition:transform .18s cubic-bezier(.2,1.4,.4,1);-webkit-tap-highlight-color:transparent}
.chat-tasto img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:contain;pointer-events:none}
.chat-tasto.zero:not(.vestito) .ct-lcd,.chat-tasto.zero:not(.vestito) .ct-led{visibility:hidden} /* (30.10: lo zero, finché muro.js non li mette sul vetro) */
.chat-tasto .ct-lcd{position:absolute;left:8.352%;top:24.677%;width:66.294%;height:56.202%;display:block;border-radius:1px;background:#a9bc96;box-shadow:inset 0 0 4px rgba(0,0,0,.6);overflow:hidden}
.chat-tasto .ct-lcd canvas{display:block;width:100%;height:100%;image-rendering:pixelated} /* il tomodachi (chat/tomodachi.js) */
/* il cercapersone scassato (23.10, dopo una morte): le crepe sul vetro dell'lcd (art/chat-pager-crepe/, chat.js le mette
   nel tasto da subito, nascoste), sopra la chiocciolina e le righe del tubo; l'ombra scura le fa leggere sull'lcd chiaro */
.chat-tasto .ct-crepe{position:absolute;inset:0;z-index:55;width:100%;height:100%;object-fit:cover;object-position:70% 30%;pointer-events:none;display:none;filter:drop-shadow(0 0 .5px rgba(0,0,0,.9))}
.chat-tasto.scassato .ct-crepe{display:block}
.chat-tasto .ct-led{position:absolute;left:84.638%;top:25.581%;width:2.685%;height:4.91%;min-width:3px;min-height:3px;border-radius:50%;background:transparent}
/* (il lampeggio è una classe che lo script mette e toglie ogni 0,6 s, .fioco: fino al 6.11 era un'animazione CSS senza
   fine, e anche a scatti teneva sveglio il compositore a ogni fotogramma, per un puntino rosso) */
.chat-tasto.msg .ct-led{background:#ff3b2e;box-shadow:0 0 6px #ff3b2e,0 0 12px rgba(255,59,46,.6)}
.chat-tasto.msg.fioco .ct-led{opacity:.25}
/* il led che lavora (chat/led.js): sfarfalla come la spia del disco di un PC finché il sistema fa qualcosa */
.chat-tasto .ct-led.lavora{background:#ff4a3a;box-shadow:0 0 5px #ff3b2e,0 0 11px rgba(255,59,46,.65);animation:none;opacity:1}
@media (hover:hover){.chat-tasto:hover{scale:1.04}}
.chat-tasto:active{scale:.96}
.chat-tasto:focus-visible{outline:3px solid #ffd400;outline-offset:4px}
@media (prefers-reduced-motion:reduce){.chat-tasto{transition:none}}
/* 404: un muro corto */
.parete.p404{height:calc(640 * var(--u))}
@media (max-width:899px){.parete.p404{height:calc(720 * var(--u))}}
.p404 .vol .titolo{font-size:max(26px,15cqw)}
</style>
</head>
<body>
<div class="strada">
  <header class="portale">
    <h1><span class="insegna-luce" aria-hidden="true"></span><img class="insegna" src="/art/insegna.svg" alt="pzkko" width="1080" height="450" fetchpriority="high"><img class="insegna notte" data-src="/art/insegna-notte.svg" alt="" aria-hidden="true" width="1080" height="450"><span class="insegna-cono" aria-hidden="true"></span></h1>
  </header>

  <main class="muro">
    <div class="riflessi" aria-hidden="true"></div>
