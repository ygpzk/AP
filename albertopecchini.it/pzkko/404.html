<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)')
  const root = document.documentElement
  root.classList.add('js')

  // ── La sera a Mantova ────────────────────────────────────────────────────
  // Alba e tramonto si calcolano qui (equazione del tramonto, NOAA) per Mantova,
  // 45,156° N 10,791° E: nessuna chiamata in rete, vale per sempre. Il muro vive
  // a Mantova: la sera cala all'ora di lì, da qualunque posto si guardi.
  // Prove: ?ora=18:30 (ora di Mantova di oggi), ?veloce=60 (il tempo corre 60×), ?notte=1.
  // Dal 29.10 di partenza l'ora è quella vera, con la sera e la notte (Alberto); dal 23.10 al 29.10 era sempre giorno.
  // Sempre giorno (l'orologio fermo a mezzogiorno di Mantova: niente buio, insegna, lampioni né auto coi fari) lo sceglie
  // chi guarda nella regia (window.pzkkoScelte.ora = 'giorno', pzkko-ora nel
  // browser); le prove (?ora, ?veloce, ?notte) la vogliono vera comunque.
  const LAT = 45.1564, LON = 10.7914, RAD = Math.PI / 180, MIN = 60000
  // Calcolo NOAA (il foglio del Global Monitoring Laboratory), al minuto: per il
  // giorno UTC dell'istante chiesto, prima stima a mezzogiorno e poi tre giri
  // all'ora dell'evento. 90,833° = orizzonte con la rifrazione.
  const evento = (ms, tramonto) => {
    const giorno0 = Math.floor(ms / 86400000) * 86400000
    let t = giorno0 + 12 * 3600000
    for (let i = 0; i < 3; i++) {
      const T = (t / 86400000 + 2440587.5 - 2451545) / 36525
      const L0 = (((280.46646 + T * (36000.76983 + T * 0.0003032)) % 360) + 360) % 360
      const M = 357.52911 + T * (35999.05029 - 0.0001537 * T)
      const e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T)
      const C = Math.sin(M * RAD) * (1.914602 - T * (0.004817 + 0.000014 * T)) + Math.sin(2 * M * RAD) * (0.019993 - 0.000101 * T) + Math.sin(3 * M * RAD) * 0.000289
      const om = 125.04 - 1934.136 * T, lam = L0 + C - 0.00569 - 0.00478 * Math.sin(om * RAD)
      const eps = 23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60 + 0.00256 * Math.cos(om * RAD)
      const decl = Math.asin(Math.sin(eps * RAD) * Math.sin(lam * RAD))
      const y = Math.tan((eps / 2) * RAD) ** 2
      const eq = (4 / RAD) * (y * Math.sin(2 * L0 * RAD) - 2 * e * Math.sin(M * RAD) + 4 * e * y * Math.sin(M * RAD) * Math.cos(2 * L0 * RAD) - 0.5 * y * y * Math.sin(4 * L0 * RAD) - 1.25 * e * e * Math.sin(2 * M * RAD))
      const ha = Math.acos(Math.max(-1, Math.min(1, Math.cos(90.833 * RAD) / (Math.cos(LAT * RAD) * Math.cos(decl)) - Math.tan(LAT * RAD) * Math.tan(decl)))) / RAD
      t = giorno0 + (720 - 4 * LON - eq + (tramonto ? ha * 4 : -ha * 4)) * MIN
    }
    return t
  }
  const sole = (ms) => ({ alba: evento(ms, false), tramonto: evento(ms, true) })
  const q = new URLSearchParams(location.search)
  const veloce = Math.max(1, Number(q.get('veloce')) || 1)
  // l'ora h:m di Mantova, oggi
  const aMantova = (h, m) => {
    const romaOra = new Date(new Date().toLocaleString('en-US', { timeZone: 'Europe/Rome' }))
    const scarto = Date.now() - romaOra.getTime()
    return new Date(romaOra.getFullYear(), romaOra.getMonth(), romaOra.getDate(), h || 0, m || 0).getTime() + scarto
  }
  const scelte = (window.pzkkoScelte ??= { scena: false, ora: 'vera', meteo: 'vero', tempo: null })
  const prova = !!q.get('ora') || q.has('veloce') || q.get('notte') !== null
  // sempre giorno: la scelta di partenza (le prove comandano solo all'apertura: scelto dalla regia, vale la scelta)
  let giorno = !prova && scelte.ora !== 'vera'
  let inizio = giorno ? aMantova(12, 0) : Date.now()
  if (q.get('ora')) {
    // l'ora chiesta è quella di Mantova, oggi
    const [h, m] = q.get('ora').split(':').map(Number)
    inizio = aMantova(h, m)
  }
  // l'orologio della pagina (window.pzkkoOrologio): la regia (regia/) lo sposta, lo accelera e lo ferma; sempre giorno,
  // sta fermo a mezzogiorno
  // perGioco(): l'ora per i meccanismi del gioco, che non sono la luce (le batterie del wallet e del cercapersone, in
  // carica dalle 19 alle 7 col cavo): quella vera quando l'orologio è fermo al mezzogiorno di Mantova (sempre giorno, la
  // partenza), quella della regia appena qualcuno lo sposta o lo fa andare (per provare la carica senza aspettare la sera)
  const orologio = window.pzkkoOrologio = (() => {
    let base = inizio, da = Date.now(), v = veloce, fermo = giorno
    const ora = () => base + (fermo ? 0 : (Date.now() - da) * v)
    const rifai = () => { base = ora(); da = Date.now() }
    return {
      adesso: ora,
      perGioco: () => (fermo && Math.abs(ora() - aMantova(12, 0)) < MIN ? Date.now() : ora()),
      imposta(ms) { base = ms; da = Date.now() },
      get veloce() { return v }, set veloce(x) { rifai(); v = x },
      get fermo() { return fermo }, set fermo(x) { rifai(); fermo = x },
    }
  })()
  const adesso = orologio.adesso
  const liscia = (x) => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x) }

  // le tre grandezze della sera: il buio (0→1 da 40 min prima del tramonto a 50 dopo),
  // l'insegna (si accende al tramonto preciso) e i lampioni (12 minuti dopo); all'alba tutto a ritroso
  const forza = { notte: null, insegna: null, lampioni: null }
  const fase = (t) => {
    const f = fase0(t)
    for (const k in forza) if (forza[k] !== null) f[k] = forza[k]
    return f
  }
  const fase0 = (t) => {
    const { alba, tramonto } = sole(t)
    if (q.get('notte') !== null) { const v = Math.max(0, Math.min(1, Number(q.get('notte')))); return { notte: v, insegna: v > 0 ? 1 : 0, lampioni: v > 0 ? 1 : 0 } }
    if (t < alba) return { notte: liscia((alba - t) / (60 * MIN)), insegna: 1, lampioni: t < alba - 10 * MIN ? 1 : 0 }
    if (t < tramonto - 40 * MIN) return { notte: 0, insegna: 0, lampioni: 0 }
    return { notte: liscia((t - (tramonto - 40 * MIN)) / (90 * MIN)), insegna: t >= tramonto ? 1 : 0, lampioni: t >= tramonto + 12 * MIN ? 1 : 0 }
  }

  // ── Lo sfarfallio delle luci al neon ─────────────────────────────────────
  // La rete a 50 Hz fa pulsare i tubi a 100 Hz: il browser disegna a 60, quindi
  // il campione cade ogni volta in un punto diverso dell'onda e ne esce il
  // tremolio tipico; sopra, ogni tanto, il tubo «sputa» (un calo breve e nervoso)
  // e all'accensione strobeggia qualche istante prima di tenere.
  // (6.11, «le ventole del pc diventano un aereo»: fino a ieri, da quando l'insegna si accendeva, il tremolio a 100 Hz
  // (un 3% che non si vedeva) chiedeva un fotogramma a ogni giro dello schermo per tutta la notte, e a ogni fotogramma lo
  // stile di tutta la pagina. Ora la luce tiene ferma a 1 e si muove solo quando si vede: lo strobo dell'accensione e i
  // cali, che hanno un'ora (poi, a caso, in media uno ogni 1/cali secondi come prima). Fra un calo e l'altro il giro dorme)
  const luce = (cali, accensione) => ({ f: 1, acceso: false, calo: 0, caloVal: 1, cali, accensione, t0: 0, poi: Infinity })
  const fra = (l) => (-Math.log(1 - Math.random()) / l.cali) * 1000
  const insegna = luce(1 / 38, 1500), lampioni = luce(1 / 20, 1100)
  const campiona = (l, t, dt, stato) => {
    if (stato && !l.acceso) { l.acceso = true; l.t0 = t; l.calo = 0; l.poi = t + l.accensione + fra(l) }
    if (!stato) { l.acceso = false; return 0 }
    if (reduce.matches || !regola.sfarfallio) return 1
    const da = t - l.t0
    if (da < l.accensione) {
      // strobo d'accensione: sempre più probabile che tenga
      const p = 0.12 + 0.88 * (da / l.accensione) ** 1.6
      return Math.random() < p ? 0.55 + 0.45 * Math.random() : 0.04
    }
    if (l.calo > 0) { l.calo -= dt; if (l.calo <= 0) l.poi = t + fra(l); return l.caloVal * (0.6 + 0.4 * Math.random()) }
    if (t >= l.poi) { l.calo = 60 + 220 * Math.random(); l.caloVal = 0.35 + 0.35 * Math.random(); l.poi = Infinity }
    return 1
  }
  // si muove adesso: l'accensione o un calo in corso
  const trema = (l, t) => l.acceso && !reduce.matches && regola.sfarfallio && (t - l.t0 < l.accensione || l.calo > 0)
  // ── Le auto che passano in strada ────────────────────────────────────────
  // Di notte, quando i lampioni sono accesi, ogni 20–90 secondi (mai più di tre
  // al minuto) passa un'auto: i fari (alogeni caldi, led freddi, xeno) spazzano
  // il muro e i fogli da un lato all'altro, poi dal lato in cui se ne va restano
  // i fanali rossi che sfumano, con una frenata ogni tanto; una su sette ha il
  // neon sotto la scocca. ?auto=1 ne fa passare una subito.
  const FARI = [['255,226,170', 1], ['214,230,255', 1], ['236,240,255', 1], ['255,214,150', 1], ['214,230,255', 1], ['255,226,170', 1]]
  let auto = null, prossimaAuto = q.get('auto') ? 0 : performance.now() + 8000 + Math.random() * 40000
  // le regole della regia: ogni (secondi, in media), fari (uno di FARI, o null a caso), neon (sì, no, null a caso),
  // subito (un'auto adesso, anche di giorno), ferma (un'auto ferma coi fari accesi in quel punto, 0..1, o null)
  const regola = { ogni: 55, fari: null, neon: null, subito: false, ferma: null, sfarfallio: true }
  const autoForzata = () => regola.subito || regola.ferma !== null
  // le luci della sera e delle auto: i valori stanno qui (window.pzkkoPagina.luci: li leggono i suoni e la regia) e la
  // pagina li vuole come variabili CSS. Si scrivono solo quando cambiano, e ognuna solo sugli elementi che la usano
  // (DOVE): la sera, l'insegna e i lampioni, che cambiano piano, su html; lo sfarfallio dell'insegna su .portale; i fari,
  // i fanali, il neon e i riflessi delle auto sui loro quattro strati. Fino al 6.11 stavano tutte su html, e ogni
  // scrittura (lo sfarfallio e le auto: una a fotogramma) costringeva il browser a ricalcolare lo stile di tutta la pagina
  const luci = { notte: 0, insegna: 0, lampioni: 0, 'f-insegna': 1, 'f-lampioni': 1, 'auto-x': 0.5, 'auto-l': 0, 'auto-c': '255,226,170', freno: 0, 'freno-x': 1.1, 'neon-auto': 0 }
  const scritte = {}
  const uno = (s) => document.querySelector(s)
  const portale = uno('.portale'), fari = uno('.fari'), freni = uno('.freni'), neonAuto = uno('.neonauto'), riflessi = uno('.riflessi')
  // (f-lampioni non la usa nessuna regola: resta solo in luci)
  const DOVE = { 'f-insegna': [portale], 'f-lampioni': [], 'auto-x': [fari, neonAuto, riflessi], 'auto-l': [fari, riflessi], 'auto-c': [fari], freno: [freni], 'freno-x': [freni], 'neon-auto': [neonAuto] }
  const set = (k, v) => {
    luci[k] = k === 'auto-c' ? v : Number(v)
    const s = String(v)
    if (scritte[k] === s) return
    scritte[k] = s
    for (const el of DOVE[k] ?? [root]) el?.style.setProperty(`--${k}`, s)
  }
  // gli strati delle luci si disegnano solo quando servono (html.sera, html.acceso, html.auto: lo stile, in alto)
  const classe = (nome, si) => { if (root.classList.contains(nome) !== si) root.classList.toggle(nome, si) }
  // la prossima auto si sceglie prima, così i suoni della strada (suono/) la fanno sentire arrivare tre secondi prima dei
  // fari: window.pzkkoSuono.evento('auto'), una volta per auto (quella che la regia chiede subito, senza anticipo)
  const nuova = () => ({ durata: 1400 + Math.random() * 1400, verso: Math.random() < 0.5 ? 1 : -1, neon: Math.random() < 1 / 7, frena: Math.random() < 0.4, detta: false })
  let prossima = nuova()
  const annuncia = (a, tra) => {
    if (a.detta) return
    a.detta = true
    window.pzkkoSuono?.evento('auto', { durata: a.durata, verso: a.verso, neon: regola.neon ?? a.neon, frena: a.frena, tra })
  }
  const passaAuto = (now) => {
    const [c] = FARI[regola.fari ?? Math.floor(Math.random() * FARI.length)]
    if (regola.subito && prossima.detta) prossima = nuova()
    auto = { t0: now, ...prossima, neon: regola.neon ?? prossima.neon }
    annuncia(auto, 0)
    prossima = nuova()
    set('auto-c', c)
  }
  const animaAuto = (now) => {
    if (regola.ferma !== null) {
      // ferma: i fari puntati in quel punto, finché la regia non la lascia andare
      set('auto-x', regola.ferma.toFixed(4)); set('auto-l', 0.9); set('neon-auto', regola.neon ? 0.8 : 0); set('freno', 0); auto = null
      return
    }
    if (!auto) {
      if (!reduce.matches && !regola.subito && now > prossimaAuto - 3000) annuncia(prossima, Math.max(0, prossimaAuto - now))
      if ((now > prossimaAuto || regola.subito) && !reduce.matches) passaAuto(now)
      return
    }
    const u = (now - auto.t0) / auto.durata
    if (u < 1) {
      const x = auto.verso > 0 ? -0.25 + 1.5 * u : 1.25 - 1.5 * u
      const l = Math.min(1, u / 0.22) * Math.min(1, (1 - u) / 0.28)
      set('auto-x', x.toFixed(4)); set('auto-l', (0.9 * l).toFixed(3)); set('neon-auto', auto.neon ? (0.8 * l).toFixed(3) : 0)
      return
    }
    set('auto-l', 0); set('neon-auto', 0)
    const v = (now - auto.t0 - auto.durata) / 1700
    if (v < 1) {
      const frenata = auto.frena && v > 0.15 && v < 0.5 ? 0.35 : 0
      set('freno-x', auto.verso > 0 ? 1.04 : -0.04); set('freno', ((1 - v) * 0.8 + frenata).toFixed(3))
    } else { set('freno', 0); auto = null; regola.subito = false; prossimaAuto = now + 1000 * regola.ogni * (0.4 + 1.2 * Math.random()) }
  }

  // Il giro delle luci: un fotogramma dopo l'altro solo finché qualcosa si muove (lo strobo dell'accensione, un calo,
  // un'auto che passa o che sta ferma coi fari); poi dorme, e un timer lo sveglia al prossimo calo o tre secondi prima
  // della prossima auto (il suo rumore arriva prima dei fari). Di notte, a strada ferma, non chiede niente
  let stato = { notte: 0, insegna: 0, lampioni: 0 }, prima = performance.now(), sfarfallioOn = false, svegliaLuci = 0
  const accendiLuci = () => { clearTimeout(svegliaLuci); if (!sfarfallioOn) { sfarfallioOn = true; prima = performance.now(); requestAnimationFrame(sfarfallio) } }
  const sfarfallio = (now) => {
    const dt = Math.min(now - prima, 100)
    prima = now
    set('f-insegna', campiona(insegna, now, dt, stato.insegna > 0).toFixed(3))
    set('f-lampioni', campiona(lampioni, now, dt, stato.lampioni > 0).toFixed(3))
    if (stato.lampioni > 0 || autoForzata() || auto) animaAuto(now)
    classe('auto', !!auto || regola.ferma !== null)
    if (trema(insegna, now) || trema(lampioni, now) || auto || regola.subito) return requestAnimationFrame(sfarfallio)
    sfarfallioOn = false
    if (document.hidden) return // (tornando in vista, aggiorna lo risveglia)
    const quando = []
    if (!reduce.matches && regola.sfarfallio) { if (stato.insegna > 0) quando.push(insegna.poi); if (stato.lampioni > 0) quando.push(lampioni.poi) }
    if (stato.lampioni > 0 && !reduce.matches && regola.ferma === null) quando.push(prossima.detta ? prossimaAuto : prossimaAuto - 3000)
    const tra = Math.min(...quando) - now
    if (Number.isFinite(tra)) svegliaLuci = setTimeout(accendiLuci, Math.max(16, Math.min(tra, 2 ** 30)))
  }

  // ── La condensa dei condizionatori sul tetto ─────────────────────────────
  // I condizionatori stanno sopra il palazzo, fuori vista: ogni 5–14 secondi (dal 6.11; prima 3–9)
  // una goccia cade dall'alto sulla lamiera, dove batte uno spruzzo; il rivolo
  // sotto è stampato sul muro.
  const strada = document.querySelector('.strada'), muro = document.querySelector('.muro')
  const rivolo = document.querySelector('.it.pezzo[src*="rivolo"]'), goccia = document.getElementById('goccia'), spruzzo = document.getElementById('spruzzo')
  const cade = () => {
    if (document.hidden || reduce.matches || !rivolo) return setTimeout(cade, 4000)
    const rs = strada.getBoundingClientRect(), rr = rivolo.getBoundingClientRect(), rm = muro.getBoundingClientRect()
    const x = rr.left + rr.width * 0.5 - rs.left - 4, y0 = -40, y1 = rm.top - rs.top + 4
    const durata = 420 + (y1 - y0) * 1.1
    // (il «plic» in cima alla lamiera, suono/suono.js)
    const plic = () => window.pzkkoSuono?.evento('goccia', { u: (rr.left + rr.width * 0.5 - rm.left) / rm.width, cima: true })
    // con la cima della lamiera fuori dallo schermo (si è scesi) la goccia non si vede: niente animazione, solo il plic,
    // allo stesso momento
    if (rm.top + 30 < 0) setTimeout(plic, durata)
    else goccia.animate([{ transform: `translate(${x}px, ${y0}px)`, opacity: 1 }, { transform: `translate(${x}px, ${y1}px)`, opacity: 1 }], { duration: durata, easing: 'cubic-bezier(.55,0,1,.6)' }).onfinish = () => {
      spruzzo.animate([{ transform: `translate(${x - 13}px, ${y1 - 10}px) scale(.4)`, opacity: .9 }, { transform: `translate(${x - 13}px, ${y1 - 12}px) scale(1)`, opacity: 0 }], { duration: 260, easing: 'ease-out' })
      plic()
    }
    setTimeout(cade, 5000 + Math.random() * 9000)
  }
  setTimeout(cade, 2500)

  // ── Le formiche ──────────────────────────────────────────────────────────
  // Cinque formiche piccole lungo il bordo basso della lamiera: camminano, si
  // fermano, cambiano verso. Si muovono solo con la pagina in vista, e solo se il
  // fondo della lamiera è nello schermo (o quasi): lontane, stanno ferme e non
  // chiedono fotogrammi, e si guarda di nuovo fra 0,3 s.
  const formiche = [...document.querySelectorAll('.formica')].map((el, i) => ({ el, x: 0, y: 0, dir: Math.random() < 0.5 ? 1 : -1, v: 12 + Math.random() * 18, pausa: 0, nata: false, lato: el.src.includes('lato') }))
  let tFormiche = performance.now()
  const camminano = (now) => {
    const dt = Math.min((now - tFormiche) / 1000, 0.1)
    tFormiche = now
    let lontane = true
    if (!document.hidden && !reduce.matches) {
      const rs = strada.getBoundingClientRect(), rm = muro.getBoundingClientRect()
      const x0 = rm.left - rs.left + 12, x1 = rm.right - rs.left - 12, yb = rm.bottom - rs.top - 16
      lontane = rm.bottom < -150 || rm.bottom - 150 > innerHeight
      for (const fo of formiche) {
        if (!fo.nata) { fo.x = x0 + Math.random() * (x1 - x0); fo.y = yb - Math.random() * 40; fo.nata = true }
        else if (lontane) continue
        if (fo.pausa > 0) { fo.pausa -= dt; continue }
        if (Math.random() < 0.004) { fo.pausa = 0.5 + Math.random() * 2; continue }
        if (Math.random() < 0.003) fo.dir = -fo.dir
        fo.x += fo.dir * fo.v * dt
        fo.y += (Math.random() - 0.5) * 6 * dt
        if (fo.x < x0) { fo.x = x0; fo.dir = 1 } else if (fo.x > x1) { fo.x = x1; fo.dir = -1 }
        if (fo.y < yb - 60) fo.y = yb - 60; else if (fo.y > yb) fo.y = yb
        const giro = fo.lato ? (fo.dir > 0 ? 'scaleX(1)' : 'scaleX(-1)') : `rotate(${fo.dir > 0 ? 90 : -90}deg)`
        fo.el.style.transform = `translate(${fo.x.toFixed(1)}px, ${fo.y.toFixed(1)}px) ${giro}`
      }
    }
    if (lontane) setTimeout(() => camminano(performance.now()), 300)
    else setTimeout(() => requestAnimationFrame(camminano), 80)
  }
  requestAnimationFrame(camminano)

  // ── Le mosche ────────────────────────────────────────────────────────────
  // Tre mosche, come le formiche ma in volo: posate stanno ferme, ogni tanto
  // si girano, fanno due passi o si puliscono le zampe; poi partono a zig zag
  // (cubiche con i punti di controllo a caso, più un tremolio di traverso),
  // passano da un punto o due e si posano altrove, dentro la parte di strada
  // che si vede. Se il puntatore si avvicina scappano. Con reduced-motion
  // restano posate dove sono nate. Dal 6.11 sono più calme: fra una mossa e l'altra stanno ferme 12–80 secondi (prima
  // 1,5–9: con tre mosche ce n'era quasi sempre una che faceva qualcosa, e la pagina non riposava mai).
  const K = 0.275 // la scala: il corpo nella foto leggera è ~52 px (il 40% dei 130 della prima), sul muro ~14
  const mosche = [...document.querySelectorAll('.mosca')].map((el, n) => ({ el, n, x: 0, y: 0, a: Math.random() * 360, stato: 'nata', t: 0, f: 'posata' }))
  const caso = (a, b) => a + Math.random() * (b - a)
  const meta = () => {
    const rs = strada.getBoundingClientRect(), rp = portale.getBoundingClientRect()
    const y0 = Math.max(rp.bottom - rs.top - 30, -rs.top + 30), y1 = Math.max(y0 + 40, Math.min(rs.height - 30, innerHeight - rs.top - 30))
    return { x: caso(24, rs.width - 24), y: caso(y0, y1) }
  }
  const mostra = (m) => {
    m.el.dataset.f = m.f
    m.el.style.transform = `translate(${m.x.toFixed(1)}px, ${m.y.toFixed(1)}px) rotate(${m.a.toFixed(1)}deg) scale(${(m.stato === 'vola' ? K * 1.12 : K).toFixed(3)})`
  }
  const posa = (m) => { m.stato = 'posata'; m.f = 'posata'; m.el.classList.remove('vola'); m.t = caso(15, 80) }
  const parti = (m, via) => {
    const punti = [{ x: m.x, y: m.y }]
    if (via) punti.push({ x: m.x + via.x, y: m.y + via.y })
    const n = Math.random() < 0.5 ? 1 : 2 + Math.floor(Math.random() * 2)
    for (let i = 0; i < n; i++) punti.push(meta())
    m.tratti = []
    for (let i = 1; i < punti.length; i++) {
      const p0 = punti[i - 1], p3 = punti[i], d = Math.hypot(p3.x - p0.x, p3.y - p0.y)
      const c = (p) => ({ x: p.x + caso(-0.6, 0.6) * d, y: p.y + caso(-0.6, 0.6) * d })
      m.tratti.push({ p0, p1: c(p0), p2: c(p3), p3, dur: Math.max(0.3, d / caso(260, 520)) })
    }
    m.pulisce = 0; m.gira = 0; m.passi = 0
    m.stato = 'vola'; m.el.classList.add('vola'); m.i = 0; m.u = 0; m.fase = Math.random() * 9
  }
  const bez = (t, a, b, c, d) => { const s = 1 - t; return s * s * s * a + 3 * s * s * t * b + 3 * s * t * t * c + t * t * t * d }
  let tMosche = performance.now()
  // Quando sono tutte posate e ferme il giro dorme: niente fotogrammi fino alla prossima
  // mossa (la più vicina delle attese m.t), o finché il puntatore non ne fa scappare una. Svegliandosi, il tempo dormito si
  // toglie alle attese, come se il giro fosse andato avanti (fino al 23.10 girava sempre: un fotogramma a ogni giro dello
  // schermo anche a mosche ferme, e a ogni fotogramma lo stile della pagina e le animazioni del cercapersone da rifare)
  let dorme = false, dormeDa = 0, attesa = 0, sveglia = 0
  const svegliaMosche = () => {
    if (!dorme) return
    dorme = false; clearTimeout(sveglia)
    const via = Math.min((performance.now() - dormeDa) / 1000, attesa)
    for (const m of mosche) if (m.stato === 'posata') m.t -= via
    tMosche = performance.now()
    requestAnimationFrame(volano)
  }
  reduce.addEventListener?.('change', svegliaMosche)
  const volano = (now) => {
    const dt = Math.min((now - tMosche) / 1000, 0.05)
    tMosche = now
    if (!document.hidden) for (const m of mosche) {
      if (m.stato === 'nata') { Object.assign(m, meta()); posa(m); m.t = caso(5, 45); mostra(m); continue }
      if (reduce.matches) continue
      if (m.stato === 'posata') {
        m.t -= dt
        if (m.pulisce > 0) { m.pulisce -= dt; m.f = m.pulisce > 0 && Math.floor(now / 140) % 2 ? 'zampe' : 'posata'; mostra(m) }
        if (m.gira) { const passo = Math.sign(m.gira) * Math.min(Math.abs(m.gira), 400 * dt); m.a += passo; m.gira -= passo; mostra(m) }
        if (m.passi > 0) { const r = (m.a - 90) * Math.PI / 180, v = 22 * dt; m.x += Math.cos(r) * v; m.y += Math.sin(r) * v; m.passi -= v; mostra(m) }
        if (m.t <= 0) {
          const r = Math.random()
          if (r < 0.35) parti(m)
          else if (r < 0.6) { m.pulisce = caso(0.8, 2.2); m.t = m.pulisce + caso(12, 50) }
          else if (r < 0.8) { m.gira = caso(25, 120) * (Math.random() < 0.5 ? -1 : 1); m.t = caso(12, 50) }
          else { m.passi = caso(3, 12); m.t = caso(12, 50) }
        }
        continue
      }
      // in volo
      m.u += dt / m.tratti[m.i].dur
      if (m.u >= 1) {
        m.i++; m.u = 0
        if (m.i >= m.tratti.length) { const fine = m.tratti.at(-1).p3; m.x = fine.x; m.y = fine.y; posa(m); m.a += caso(-40, 40); mostra(m); continue }
      }
      const t = m.tratti[m.i], u = m.u
      const x = bez(u, t.p0.x, t.p1.x, t.p2.x, t.p3.x), y = bez(u, t.p0.y, t.p1.y, t.p2.y, t.p3.y)
      const dx = x - m.x, dy = y - m.y
      m.fase += dt * 23
      const tremo = Math.sin(m.fase) * 2.2 + Math.sin(m.fase * 2.7) * 1.3, l = Math.hypot(dx, dy) || 1
      m.x = x - (dy / l) * tremo; m.y = y + (dx / l) * tremo
      if (l > 0.2) m.a = Math.atan2(dy, dx) * 180 / Math.PI + 90
      m.f = (Math.floor(now / 28) + m.n) % 2 ? 'vola' : 'vola2'
      mostra(m)
    }
    if (!document.hidden && mosche.every((m) => m.stato === 'posata' && !(m.pulisce > 0) && !m.gira && !(m.passi > 0))) {
      // (col movimento ridotto restano posate e le attese non corrono, come prima: si dorme finché la preferenza non cambia)
      attesa = reduce.matches ? 0 : Math.max(0, Math.min(...mosche.map((m) => m.t)))
      dorme = true; dormeDa = now
      sveglia = reduce.matches ? 0 : setTimeout(svegliaMosche, Math.min(attesa * 1000, 1e9))
      return
    }
    requestAnimationFrame(volano)
  }
  requestAnimationFrame(volano)
  // il puntatore che si avvicina le fa scappare
  addEventListener('pointermove', (e) => {
    if (reduce.matches) return
    const rs = strada.getBoundingClientRect(), px = e.clientX - rs.left, py = e.clientY - rs.top
    for (const m of mosche) {
      const d = Math.hypot(m.x - px, m.y - py)
      if (m.stato === 'posata' && d < 70) { parti(m, { x: ((m.x - px) / (d || 1)) * 140, y: ((m.y - py) / (d || 1)) * 140 }); svegliaMosche() }
    }
  }, { passive: true })
  // (l'insegna accesa del muro di sempre si chiede la prima volta che serve: di giorno, cioè di partenza, mai)
  const insegnaNotte = document.querySelector('img.insegna.notte[data-src]')
  // (sveglia il giro delle luci solo quando una luce si accende o si spegne, o quando lo chiede la regia: a luci ferme il
  // suo timer sa già quando tornare)
  let partite = false
  const aggiorna = (sveglia = false) => {
    const era = stato
    stato = fase(adesso())
    // (di sera il buio cambia di un millesimo ogni cinque secondi, e ogni scrittura su html è lo stile di tutta la pagina:
    // al centesimo, una scrittura al minuto; a occhio è lo stesso)
    set('notte', stato.notte.toFixed(2))
    set('insegna', stato.insegna)
    set('lampioni', stato.lampioni)
    classe('sera', stato.notte > 0)
    classe('acceso', stato.insegna > 0)
    if (stato.insegna > 0 && insegnaNotte && !insegnaNotte.src) insegnaNotte.src = insegnaNotte.dataset.src
    const cambiate = (stato.insegna > 0) !== (era.insegna > 0) || (stato.lampioni > 0) !== (era.lampioni > 0)
    if (sveglia || cambiate || !partite || autoForzata()) { partite = true; accendiLuci() }
  }
  // all'apertura le luci già accese non strobeggiano: sono accese da un pezzo
  { const f0 = fase(adesso()), t = performance.now(); if (f0.insegna) { insegna.acceso = true; insegna.t0 = -1e9; insegna.poi = t + fra(insegna) } if (f0.lampioni) { lampioni.acceso = true; lampioni.t0 = -1e9; lampioni.poi = t + fra(lampioni) } }
  aggiorna()
  const tic = () => { aggiorna(); setTimeout(tic, orologio.veloce > 1 ? 250 : 1000) }
  setTimeout(tic, veloce > 1 ? 250 : 1000)
  document.addEventListener('visibilitychange', () => { if (!document.hidden) aggiorna(true) })

  // I giochi: la roulette, il blackjack, testa o croce, le mine, il dado e virtual, ognuno in una finestra sopra il muro
  // (games/<gioco>/). Dal 6.11 non hanno più il volantino sulla saracinesca: si aprono dalla pagina dei gadget (la barra in
  // alto), dal cercapersone e con #roulette, #blackjack, #moneta, #mine, #dado o #virtual nell'indirizzo. Il codice e il 3D
  // del gioco si caricano solo quando si apre. Un volantino con <a data-gioco="…"> lo aprirebbe ancora
  const GIOCHI = ['roulette', 'blackjack', 'moneta', 'mine', 'dado', 'virtual']
  const apriGioco = (nome) => import(`/games/${nome}/${nome}.js`).then((m) => m.apri())
  for (const gioco of document.querySelectorAll('a[data-gioco]')) {
    const nome = gioco.dataset.gioco
    if (GIOCHI.includes(nome)) gioco.addEventListener('click', (e) => { e.preventDefault(); history.replaceState(null, '', `#${nome}`); apriGioco(nome) })
  }
  const nel = location.hash.slice(1)
  if (GIOCHI.includes(nel)) apriGioco(nel)
  // (dalla pagina dei gadget, a home già aperta: l'indirizzo cambia e basta)
  addEventListener('hashchange', () => { const g = location.hash.slice(1); if (GIOCHI.includes(g)) apriGioco(g) })

  // ── La regia ─────────────────────────────────────────────────────────────
  // Il pannello per provare e regolare il sito: l'ora di Mantova e la sua velocità, la sera, le auto, i suoni (regia/). Dal 23.10 non c'è più il tasto giallo (Alberto: «togli tasto
  // regia»): si apre scrivendo «regia» sulla tastiera, con #regia nell'indirizzo o toccando cinque volte in fretta la
  // striscia in cima allo schermo (sul telefono); lo scontrino delle novità (benvenuto/) lo dice. Il codice si scarica
  // solo allora.
  window.pzkkoPagina = {
    orologio, forza, regola, sole, luci, aggiorna: () => aggiorna(true),
    passaAuto: () => { regola.subito = true; aggiorna(true) },
    // un'auto ferma coi fari accesi nel punto x (0..1 della larghezza), o null: se ne va
    fermaAuto: (x) => { regola.ferma = x; if (x === null) { set('auto-l', 0); set('neon-auto', 0) } aggiorna(true) },
    // (le mosche del muro di sempre, per il loro ronzio: suono/suono.js)
    mosche,
    // le scelte di chi guarda (window.pzkkoScelte, nella testa della pagina): scegli le cambia, le ricorda nel browser e
    // mette subito l'ora e il meteo (il 3D non si sceglie più: solo 2D, dal 6.11). partenza = l'ora da cui la pagina
    // riparte da sé (mezzogiorno, o adesso); rimettiOra ci torna
    scelte,
    partenza: () => (giorno ? aMantova(12, 0) : Date.now()),
    rimettiOra: () => { orologio.fermo = giorno; orologio.veloce = 1; orologio.imposta(giorno ? aMantova(12, 0) : Date.now()); aggiorna(true) },
    scegli(k, v) {
      if (k !== 'ora' && k !== 'meteo') return
      scelte[k] = v
      const [chiave, valore] = { ora: ['pzkko-ora', v], meteo: ['pzkko-meteo', v] }[k]
      try { localStorage.setItem(chiave, valore) } catch {}
      if (k === 'ora') { giorno = v !== 'vera'; for (const x in forza) forza[x] = null; window.pzkkoPagina.rimettiOra() }
      if (k === 'meteo' && window.pzkkoRegia) window.pzkkoRegia.meteo = scelte.tempo
    },
  }
  const apriRegia = () => import('/regia/regia.js').then((m) => m.apri()).catch((e) => console.warn('regia non aperta', e))
  let scritto = ''
  addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1 || e.target.closest?.('input, textarea')) return
    scritto = (scritto + e.key.toLowerCase()).slice(-5)
    if (scritto === 'regia') { scritto = ''; apriRegia() }
  })
  let tocchi = []
  addEventListener('pointerdown', (e) => {
    if (e.clientY > 70) return
    tocchi = [...tocchi.filter((t) => e.timeStamp - t < 2500), e.timeStamp]
    if (tocchi.length >= 5) { tocchi = []; apriRegia() }
  }, { passive: true })
  if (nel === 'regia') apriRegia()

  // ── Il wallet dei $pzk (wallet/): il tasto in alto a sinistra, il portafoglio che si apre, i conti (api/wallet.mjs) e
  // la borsa (api/borsa.mjs). Il modulo arriva da solo appena la pagina è tranquilla (così il led del tasto dice il
  // saldo), e subito al clic; i giochi lo aprono con l'evento pzkko-wallet (games/pzk.js, apriWallet). #wallet lo apre.
  // Gli strumenti che fotografano la pagina non lo vedono (navigator.webdriver), se non con ?wallet ──
  {
    const tasto = document.querySelector('.wallet-tasto')
    if (tasto && (!navigator.webdriver || q.has('wallet'))) {
      tasto.hidden = false
      let modulo = null
      const carica = () => (modulo ??= Promise.all([import('/wallet/wallet.js'), new Promise((ok) => { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = '/wallet/wallet.css'; l.onload = l.onerror = ok; document.head.appendChild(l) })])
        .then(([m]) => { m.prepara(tasto); return m }).catch((e) => { modulo = null; console.warn('wallet non caricato', e); throw e }))
      const apri = (sezione) => carica().then((m) => m.apri(sezione)).catch(() => {})
      tasto.addEventListener('click', () => apri())
      document.addEventListener('pzkko-wallet', (e) => apri(e.detail?.sezione))
      ;(window.requestIdleCallback ?? setTimeout)(() => carica().catch(() => {}), { timeout: 3500 })
      if (nel === 'wallet') apri()
    }
  }

  // ── La chat col bot dei $pzk (chat/): il cercapersone sotto il wallet. Il modulo arriva da solo
  // appena la pagina è tranquilla (così il cercapersone sa se c'è un premio da riscuotere) e subito al clic; #chat la apre,
  // l'evento pzkko-chat pure (con detail.comando si scrive un comando). Gli strumenti che fotografano non la vedono ──
  {
    const tasto = document.querySelector('.chat-tasto')
    if (tasto && (!navigator.webdriver || q.has('chat'))) {
      tasto.hidden = false
      let modulo = null
      const carica = () => (modulo ??= Promise.all([import('/chat/chat.js'), new Promise((ok) => { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = '/chat/chat.css'; l.onload = l.onerror = ok; document.head.appendChild(l) })])
        .then(([m]) => { m.prepara(tasto); return m }).catch((e) => { modulo = null; console.warn('chat non caricata', e); throw e }))
      const apri = (comando) => carica().then((m) => m.apri(comando)).catch(() => {})
      tasto.addEventListener('click', () => apri())
      // il led rosso che lampeggia quando c'è un premio (.msg): si affievolisce e torna ogni 0,6 s (.fioco, lo stile in alto)
      setInterval(() => { const si = tasto.classList.contains('msg') && !tasto.classList.contains('fioco') && !document.hidden && !reduce.matches; if (si !== tasto.classList.contains('fioco')) tasto.classList.toggle('fioco', si) }, 600)
      document.addEventListener('pzkko-chat', (e) => apri(e.detail?.comando))
      ;(window.requestIdleCallback ?? setTimeout)(() => carica().catch(() => {}), { timeout: 4000 })
      if (nel === 'chat') apri()
      // la voce «account» della barra, dalle altre pagine; poi via il #account dall'indirizzo, così non si riapre (ricaricando, col tasto indietro)
      if (nel === 'account') { history.replaceState(null, '', location.pathname + location.search); carica().then(() => import('/games/pzk.js')).then((p) => p.apriWallet('conto')).catch(() => {}) }
    }
  }

  // ── I suoni della strada (suono/) ────────────────────────────────────────
  // Tutto sintetizzato dal vivo, niente file: la città, le campane, gli uccelli, l'insegna che ronza, le auto, il meteo
  // vero, la goccia, le mosche, il PC del negozio. Il browser lascia partire l'audio solo dopo un gesto: partono al primo
  // tocco o tasto, sfumando, ma solo se chi guarda li ha accesi (pzkko-suono = si nel browser: dal 29.10 di partenza sono
  // spenti, Alberto: «impostazioni predefinite audio off»); il nastro in basso a sinistra li accende e li spegne. Il motore (suono/suono.js) si scarica solo allora, e riceve il contesto già sbloccato qui,
  // dentro il gesto (Safari lo vuole lì). window.pzkkoSuono: acceso, volume (la strada), musica, accendi(sì, ricorda) e prova(nome) per la
  // regia, evento(nome, dati) per la pagina e la scena, che aspetta in coda finché il motore non c'è. Gli strumenti che
  // fotografano la pagina (navigator.webdriver) il nastro non lo vedono, se non con ?suono
  {
    const AC = window.AudioContext ?? window.webkitAudioContext
    const tasto = document.querySelector('.suono'), coda = []
    let vuole = false, ctx = null, motore = null, spegni = 0
    try { vuole = localStorage.getItem('pzkko-suono') === 'si' } catch {}
    const S = window.pzkkoSuono = {
      acceso: false, volume: 0.2, musica: 0.3, coda, // (26.10: la strada al 20%, la musica di suono/musica.js al 30%)
      evento: (nome, dati = {}) => { if (coda.length < 24) coda.push([nome, dati, performance.now()]) },
      accendi(si = true, ricorda = false) {
        if (ricorda) { vuole = si; try { localStorage.setItem('pzkko-suono', si ? 'si' : 'no') } catch {} }
        tasto?.setAttribute('aria-pressed', String(si))
        if (!si) { S.acceso = false; clearTimeout(spegni); if (ctx) spegni = setTimeout(() => { if (!S.acceso) ctx.suspend() }, 600); return }
        if (!AC) return
        S.acceso = true
        if (!ctx) {
          ctx = new AC({ latencyHint: 'balanced' })
          S.ctx = ctx // (anche per i suoni dell'interfaccia: suono/interfaccia.js)
          // (sull'iPhone come un suono di sottofondo: rispetta il tasto del silenzioso e non ferma la musica)
          try { if (navigator.audioSession) navigator.audioSession.type = 'ambient' } catch {}
          ctx.onstatechange = () => tasto?.classList.toggle('va', ctx.state === 'running' && S.acceso)
        }
        clearTimeout(spegni)
        ctx.resume().catch(() => {})
        // (il motore calcola i suoi rumori e l'eco tutti insieme: sul telefono mezzo secondo fermo, e il primo gesto di solito
        // è il dito che comincia a scorrere o che tocca un volantino. Quindi parte dopo il gesto, quando la pagina non scorre
        // da 0,3 s e il browser è libero: i suoni sfumano dentro lo stesso, e gli eventi aspettano in coda)
        motore ??= import('/suono/suono.js').then((m) => new Promise((ok) => {
          let t = 0
          const ferma = () => { clearTimeout(t); t = setTimeout(() => { removeEventListener('scroll', ferma); (window.requestIdleCallback ?? setTimeout)(ok, { timeout: 800 }) }, 300) }
          addEventListener('scroll', ferma, { passive: true }); ferma()
        }).then(() => m.accendi(ctx))).catch((e) => console.warn('suoni non partiti', e))
      },
      prova: (nome) => { S.accendi(true); S.evento('prova', { nome }) },
    }
    if (AC && tasto && (!navigator.webdriver || q.has('suono'))) tasto.hidden = false
    tasto?.setAttribute('aria-pressed', String(vuole))
    tasto?.addEventListener('click', () => S.accendi(tasto.getAttribute('aria-pressed') !== 'true', true))
    // il primo gesto li accende; i gesti dopo lo sbloccano, finché il browser non lo lascia suonare davvero (col dito vale
    // il tocco che finisce, non quello che comincia)
    const gesti = ['pointerdown', 'pointerup', 'touchend', 'keydown']
    const sblocca = (e) => {
      if (!vuole || e.target?.closest?.('.suono')) return
      if (!S.acceso) S.accendi(true)
      ctx?.resume().then(() => { if (ctx.state === 'running') for (const g of gesti) removeEventListener(g, sblocca, true) }, () => {})
    }
    for (const g of gesti) addEventListener(g, sblocca, { capture: true, passive: true })
    document.addEventListener('visibilitychange', () => { if (!ctx) return; if (document.hidden) ctx.suspend(); else if (S.acceso) ctx.resume() })
    addEventListener('pagehide', () => ctx?.suspend())
    addEventListener('pageshow', (e) => { if (e.persisted && S.acceso) ctx?.resume() })
  }

  // Sul telefono non c'è il passaggio del puntatore: toccare un foglio o un
  // manifesto lo porta in primo piano (resta su finché non se ne tocca un altro).
  let sopra = null
  document.querySelector('.parete').addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse') return
    const el = e.target.closest('.vol, .man')
    if (!el || el === sopra) return
    sopra?.classList.remove('sopra')
    el.classList.add('sopra')
    sopra = el
  }, { passive: true })

  // I tagliandi sono fette della carta del volantino: ognuno mostra il pezzo di
  // foglio che gli tocca (stessa immagine, spostata), così quando si strappa
  // resta il buco col muro dietro.
  // (prima si leggono tutte le misure e poi si scrive: scrivendo un tagliando e leggendo il dopo, il browser rifaceva lo
  // stile a ogni tagliando)
  const fette = () => {
    const tagli = []
    for (const t of document.querySelectorAll('.tagliandi')) {
      const vol = t.closest('.vol')
      const r = vol.getBoundingClientRect()
      const flip = getComputedStyle(vol).getPropertyValue('--flip').trim() === '-1'
      for (const b of t.querySelectorAll('button')) tagli.push([b, r, b.getBoundingClientRect(), flip])
    }
    for (const [b, r, rb, flip] of tagli) {
      // posizione del tagliando rispetto al foglio, senza la rotazione (rapporti, non pixel)
      const w = r.width, h = r.height
      b.style.setProperty('--bgsize', `${(w / rb.width) * 100}% ${(h / rb.height) * 100}%`)
      const ox = flip ? (r.right - rb.right) : (rb.left - r.left)
      const px = ox / (w - rb.width) * 100
      const py = (rb.top - r.top) / (h - rb.height) * 100
      b.style.setProperty('--bgpos', `${px}% ${py}%`)
      if (flip) b.style.transform = ''
    }
  }
  // Nessuna scritta esce dal suo riquadro: se un titolo è più largo del foglio (pzk$meeting) o il testo è più alto, il
  // volantino si rimpicciolisce (--fit, sui font di .vol) a passi del 4 % finché ci sta, fino alla metà. Si rifà quando la
  // finestra cambia e quando arrivano i font. Tutti i volantini insieme, a passi: si scrive il --fit di quelli che sbordano
  // e poi si legge una volta sola (ogni volantino sta per conto suo, quindi è lo stesso conto; uno alla volta, ogni passo
  // rifaceva l'impaginazione della pagina: ~240 volte all'apertura, 0,16 s fermi sul telefono prima del primo disegno)
  const adatta = () => {
    let fogli = [...document.querySelectorAll('.vol:not(.s)')].map((v) => { // (i compatti, .s, stanno nel foglio per costruzione)
      v.style.setProperty('--fit', '1')
      const testo = v.querySelector('.testo') ?? v
      return { v, testo, righe: [...testo.querySelectorAll('h3, .titolo, p, .mano, .handle, .forte, li, .pet-testa, .pet-sotto')], fit: 1 }
    })
    const sborda = ({ testo, righe }) => testo.scrollHeight > testo.clientHeight + 1 || righe.some((e) => e.scrollWidth > e.clientWidth + 1)
    while ((fogli = fogli.filter((f) => f.fit > 0.5 && sborda(f))).length) for (const f of fogli) { f.fit -= 0.04; f.v.style.setProperty('--fit', f.fit.toFixed(2)) }
  }
  // il calcolo usa i rettangoli non ruotati: si misura col volantino dritto. Intanto la sua transizione (il foglio che si
  // solleva) sta spenta, e torna solo a volantino di nuovo storto: se no a ogni misura (all'apertura due volte) tutti i
  // volantini partivano a girarsi dal dritto al loro posto, 0,32 s di fotogrammi
  const misura = () => {
    const vols = [...document.querySelectorAll('.vol')]
    for (const v of vols) { v.style.transition = 'none'; v.style.transform = 'none' }
    adatta()
    fette()
    for (const v of vols) v.style.transform = ''
    void vols[0]?.offsetWidth
    for (const v of vols) v.style.transition = ''
  }
  misura()
  // (solo se cambia la larghezza: l'altezza non sposta niente, e sul telefono la barra dell'indirizzo che va e viene
  // mentre si scorre la cambia di continuo)
  let misurata = [innerWidth, devicePixelRatio]
  addEventListener('resize', () => {
    if (innerWidth === misurata[0] && devicePixelRatio === misurata[1]) return
    misurata = [innerWidth, devicePixelRatio]
    misura()
  })
  document.fonts?.ready.then(misura)

  // ── Le immagini lontane ──────────────────────────────────────────────────
  // Le immagini pigre (loading=lazy) che il browser non ha ancora chiesto le guarda un suo IntersectionObserver, e finché
  // un'animazione è in corso (la banda e lo sfarfallio del tubo catodico del cercapersone non si fermano mai) un
  // osservatore con qualcosa da guardare fa lavorare il filo della pagina a ogni fotogramma: stile, disegno, consegna al
  // compositor, a pagina ferma (sul telefono un quinto del processore). Quindi le pigre ancora lontane (più di 1250 px
  // dallo schermo, la soglia di Chrome col 4G; 2500 con la rete più lenta) si tengono da parte senza src (la scatola resta
  // della sua misura, per width e height) e si rimettono quando lo scorrimento, la finestra che cambia o la stampa le
  // portano a quella distanza: si scaricano quando si scaricavano prima, e a pagina ferma il filo della pagina dorme. Si
  // guarda al primo fotogramma, dopo le formiche (che lì vanno al loro posto, in fondo); prima si misurano tutte e poi si
  // tolgono e rimettono (una alla volta, ogni misura rifaceva l'impaginazione). Negli strumenti che fotografano la
  // pagina (navigator.webdriver: aspettano le pigre rendendole subito) niente. (Dal 6.11 nella home di pigre non ce n'è
  // più: questo serve alla storia, che ha lo stesso script)
  {
    const SOGLIA = /2g|3g/.test(navigator.connection?.effectiveType ?? '') ? 2500 : 1250
    // di ognuna dove sta nella pagina (su e giù, scorrimento compreso): si misura quando la si mette da parte e di nuovo
    // solo se la finestra cambia; scorrendo bastano due confronti (misurarle tutte a ogni fotogramma, ruotate come sono,
    // costava 2 ms a fotogramma sul telefono)
    let lontane = [], guardo = 0, rimisura = false
    const dove = (i) => { const r = i.getBoundingClientRect(); return { i, su: r.top + scrollY, giu: r.bottom + scrollY } }
    const vicina = (x) => x.giu > scrollY - SOGLIA && x.su < scrollY + innerHeight + SOGLIA
    const rimetti = ({ i }) => { i.loading = 'eager'; i.src = i.dataset.poi; i.removeAttribute('data-poi') }
    const guarda = () => {
      guardo = 0
      if (rimisura) { rimisura = false; lontane = lontane.map(({ i }) => dove(i)) }
      const ora = lontane.filter(vicina)
      if (ora.length) { lontane = lontane.filter((x) => !ora.includes(x)); for (const x of ora) rimetti(x) }
      if (!lontane.length) { removeEventListener('scroll', presto); removeEventListener('resize', cambia) }
    }
    const presto = () => { guardo ||= requestAnimationFrame(guarda) }
    const cambia = () => { rimisura = true; presto() }
    if (!navigator.webdriver) requestAnimationFrame(() => {
      // (tutte quelle non ancora chieste, anche le vicine, che tornano subito senza pigrizia: lasciate al browser, quelle al
      // confine della sua soglia potevano restare a guardare)
      lontane = [...document.querySelectorAll('img[loading=lazy]')].filter((i) => !i.currentSrc && i.getAttribute('src')).map(dove)
      for (const { i } of lontane) { i.dataset.poi = i.getAttribute('src'); i.removeAttribute('src') }
      guarda()
      if (!lontane.length) return
      addEventListener('scroll', presto, { passive: true })
      addEventListener('resize', cambia)
      addEventListener('beforeprint', () => { for (const x of lontane) rimetti(x); lontane = []; guarda() })
    })
  }

  // strappare un tagliando copia il contatto
  let nota
  const copia = async (t, b) => {
    const testo = t.dataset.copia
    let ok = false
    try { await navigator.clipboard.writeText(testo); ok = true } catch {}
    const vol = t.closest('.vol')
    nota?.remove()
    nota = document.createElement('span')
    nota.className = 'copiato'
    // (sui volantini compatti la nota è corta: il contatto è scritto lì sopra)
    nota.textContent = !ok ? testo : vol.classList.contains('s') ? 'copiato!' : `copiato: ${testo}`
    vol.appendChild(nota)
    requestAnimationFrame(() => nota.classList.add('si'))
    setTimeout(() => nota?.classList.remove('si'), 2600)
    window.pzkkoSuono?.evento('strappo')
    const fine = () => { b.classList.add('via'); b.classList.remove('cade'); b.setAttribute('aria-disabled', 'true') }
    if (reduce.matches) fine()
    else { b.classList.add('cade'); b.addEventListener('transitionend', fine, { once: true }); setTimeout(fine, 700) }
    const vivi = t.querySelectorAll('button:not(.via)').length
    if (vivi === 0) setTimeout(() => { for (const x of t.querySelectorAll('button')) { x.classList.remove('via'); x.removeAttribute('aria-disabled') } }, 1800)
  }
  for (const t of document.querySelectorAll('.tagliandi')) {
    t.setAttribute('role', 'group')
    t.setAttribute('aria-label', `tagliandi da strappare: copiano ${t.dataset.nome}`)
    for (const b of t.querySelectorAll('button')) {
      b.setAttribute('aria-label', `strappa un tagliando e copia ${t.dataset.nome}`)
      b.addEventListener('click', () => { if (!b.classList.contains('via')) copia(t, b) })
    }
  }

  // ── La petizione (petizione/): le firme vere sul foglio e il foglio che si avvicina per firmare. Il modulo e il suo
  // stile si scaricano quando ci si avvicina (le firme si vedono sul muro); toccare il foglio, o una penna, lo apre.
  // Gli strumenti che fotografano la pagina non lo caricano, se non con ?petizione ──
  const petizione = document.getElementById('petizione')
  if (petizione) {
    let modulo = null
    const carica = () => (modulo ??= (() => {
      const l = document.createElement('link')
      l.rel = 'stylesheet'; l.href = '/petizione/petizione.css'
      const css = new Promise((ok) => { l.onload = l.onerror = ok })
      document.head.appendChild(l)
      return Promise.all([import('/petizione/petizione.js'), css]).then(([m]) => { m.prepara(petizione); return m })
    })())
    const apri = (e) => { e.preventDefault(); const p = e.currentTarget.closest('.penna')?.dataset.penna; carica().then((m) => m.apri(p)).catch((err) => console.warn('petizione non aperta', err)) }
    petizione.querySelector('[data-petizione]')?.addEventListener('click', apri)
    for (const p of petizione.querySelectorAll('.penna img')) p.addEventListener('click', apri)
    // (6.11) La petizione sta in fondo alla saracinesca: il suo codice, le firme dal server e i quattro caratteri delle
    // calligrafie (~190 KB) si chiedono quando ci si avvicina (a meno di due schermi), o subito con #petizione
    // nell'indirizzo; fino al 6.11 partivano per tutti appena la pagina era libera, anche per chi non scendeva mai
    if (!navigator.webdriver || q.has('petizione')) {
      const vicina = () => petizione.getBoundingClientRect().top < innerHeight * 3
      const guarda = () => { if (!vicina()) return; removeEventListener('scroll', guarda); removeEventListener('resize', guarda); (window.requestIdleCallback ?? setTimeout)(carica, { timeout: 1500 }) }
      if (nel === 'petizione') carica()
      else { addEventListener('scroll', guarda, { passive: true }); addEventListener('resize', guarda); guarda() }
    }
  }

})()
</script>
<!-- lo scontrino delle novità (benvenuto/): una volta per versione, a pagina caricata; ?novita lo fa rivedere -->
<script type="module" src="/benvenuto/benvenuto.js"></script>
<script type="module" src="/barra/barra.js"></script>
</body>
