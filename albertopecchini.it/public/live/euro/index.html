<title>€ che gira</title>
<style>
  /* livello web per Camo / OBS (13.11.2026): € nero 3D che gira, loop di 8 s.
     sfondo trasparente; ?verde → fondo verde euroshit su tutta la finestra */

  body { display: grid; place-items: center; }
  img { width: 100vmin; height: 100vmin; object-fit: contain; display: block; }

</style>
