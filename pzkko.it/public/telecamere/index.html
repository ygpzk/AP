<style>
  /* la porta di e-vision: un foglio del muro (carta col nastro, Anton, pennarello, macchina da scrivere)
     sopra i due colori di pzkko */
  @font-face { font-family: "Anton"; src: url(/fonts/anton.woff2) format("woff2"); font-display: swap; }
  @font-face { font-family: "Special Elite"; src: url(/fonts/special-elite.woff2) format("woff2"); font-display: swap; }
  @font-face { font-family: "Permanent Marker"; src: url(/fonts/permanent-marker.woff2) format("woff2"); font-display: swap; }
  :root {
    --ink: #1b1916;
    --testo: #36312b;
    --rosso: #b3121f;
    --giallo: #ffd400;
    --fa: "Anton", Impact, "Arial Narrow", sans-serif;
    --marker: "Permanent Marker", "Comic Sans MS", cursive;
    --mac: "Special Elite", "Courier New", monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { min-height: 100%; background: #0b090e; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: calc(64px + env(safe-area-inset-top, 0px)) 44px calc(64px + env(safe-area-inset-bottom, 0px));
    background:
      radial-gradient(900px 620px at 6% -8%, rgba(204, 255, 0, .34), transparent 70%),
      radial-gradient(1000px 760px at 104% 108%, rgba(157, 0, 255, .42), transparent 70%),
      #0b090e;
    color: var(--testo);
    font: 400 16px/1.55 var(--mac);
    -webkit-font-smoothing: antialiased;
  }
  main {
    position: relative;
    isolation: isolate;
    display: grid;
    justify-items: center;
    gap: 12px;
    width: min(100%, 400px);
    padding: 24px 20px 18px;
    text-align: center;
    color-scheme: light;
    animation: posa .5s cubic-bezier(.2, 1.3, .4, 1) both;
  }
  main::before {
    content: "";
    position: absolute;
    inset: -36px;
    z-index: -1;
    pointer-events: none;
    border: 0 solid transparent;
    border-image: url(/art/roulette/carta.webp) 300 fill / 96px stretch;
    filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .35)) drop-shadow(0 24px 30px rgba(0, 0, 0, .4));
  }
  .foto { display: block; width: 86px; height: 96px; padding: 6px 6px 16px; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .3); transform: rotate(-3deg); }
  .foto svg { display: block; width: 100%; height: 100%; }
  .voce { margin: 0; font: 400 15px/1.2 var(--marker); color: var(--rosso); text-transform: uppercase; letter-spacing: .02em; transform: rotate(-2deg); }
  h1 { margin: -6px 0 0; font: 400 clamp(52px, 17vw, 68px)/1 var(--fa); color: var(--ink); text-transform: lowercase; letter-spacing: .005em; }
  p { margin: 0; max-width: 34ch; }
  mark { color: inherit; background: linear-gradient(transparent 12%, rgba(255, 212, 0, .58) 12% 88%, transparent 88%); }
  .timbro { display: inline-block; padding: 3px 8px 2px; border: 2.5px solid currentColor; border-radius: 3px; color: #1f7a45; background: rgba(255, 255, 255, .6); font: 400 12px/1.1 var(--mac); letter-spacing: .12em; text-transform: uppercase; transform: rotate(-4deg); }
  .fine { display: grid; justify-items: center; gap: 12px; width: 100%; margin-top: 4px; padding-top: 18px; border-top: 2px dashed rgba(27, 25, 22, .28); }
  .tasto {
    display: inline-block;
    padding: .12em .5em .16em;
    background: var(--ink);
    color: #fff;
    font: 400 30px/1.05 var(--fa);
    text-transform: lowercase;
    text-decoration: none;
    white-space: nowrap;
    transform: rotate(-2deg);
    box-shadow: 0 0 0 3px var(--giallo), 4px 5px 0 2px rgba(0, 0, 0, .2);
    transition: transform .18s cubic-bezier(.22, 1, .36, 1);
  }
  @media (hover: hover) { .tasto:hover { transform: rotate(-2deg) translateY(-2px); } }
  .tasto:active { transform: rotate(-2deg) translateY(2px); }
  .tasto:focus-visible { outline: 3px solid var(--giallo); outline-offset: 5px; }
  .piede { font-size: 13px; line-height: 1.45; color: #5a544c; }
  @keyframes posa { from { opacity: 0; transform: translateY(26px) rotate(-2deg) scale(.96); } }
  @media (prefers-reduced-motion: reduce) { main { animation: none; } .tasto { transition: none; } }
</style>
</head>

<main>
  <span class="foto" aria-hidden="true">

  </span>
  <p class="voce">le telecamere, in diretta</p>
  <h1>e-vision</h1>
  <span class="timbro">accesso riservato</span>
  <p>Otto telecamere dal vivo, sul server di casa. Dal telefono <mark>si aggiunge alla schermata Home</mark> e si apre a tutto schermo, come un&rsquo;app.</p>
  <div class="fine">
    <a class="tasto" href="https://desktop-inpvhr2.tail6c90b3.ts.net/telecamere/" target="_blank" rel="noopener noreferrer">apri e-vision</a>
    <p class="piede">HTTPS e password. Se non hai la password, chiedila a pzkko.</p>
  </div>
