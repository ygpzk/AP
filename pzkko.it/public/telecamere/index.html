<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f8f6f0">
<title>e-vision &mdash; pzkko</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='116' fill='%23007acc'/%3E%3Cpath d='M142 256H370A114 114 0 1 0 329.3 343.3' fill='none' stroke='%23faf9f5' stroke-width='46' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* e-vision ha il suo vestito: carta calda, inchiostro, un solo blu */
  @font-face {
    font-family: 'Hanken Grotesk Variable';
    font-style: normal;
    font-display: swap;
    font-weight: 100 900;
    src: url('fonts/hanken-grotesk.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Fraunces Variable';
    font-style: normal;
    font-display: swap;
    font-weight: 100 900;
    src: url('fonts/fraunces.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Geist Mono Variable';
    font-style: normal;
    font-display: swap;
    font-weight: 100 900;
    src: url('fonts/geist-mono.woff2') format('woff2');
  }
  :root {
    --bg: #f8f6f0;
    --card: #faf9f5;
    --fg: #1a1b1a;
    --muted: #525252;
    --line: rgb(26 27 26 / 0.12);
    --accent: #007acc;
    --accent-text: #005c9e;
    --glow: rgb(0 122 204 / 0.22);
    --vivo: #2f9e5b;
    --sans: 'Hanken Grotesk Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'Geist Mono Variable', ui-monospace, 'SF Mono', Consolas, monospace;
    --serif: 'Fraunces Variable', 'Iowan Old Style', Georgia, serif;
    --silk: cubic-bezier(0.22, 1, 0.36, 1);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1.25rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    text-transform: lowercase;
    -webkit-font-smoothing: antialiased;
  }
  main {
    display: grid;
    gap: 1.5rem;
    width: min(100%, 34rem);
    padding: clamp(1.6rem, 1rem + 3vw, 2.75rem);
    border: 1px solid var(--line);
    border-radius: 1.75rem;
    background: var(--card);
  }
  .marchio {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    font-family: var(--serif);
    font-weight: 340;
    font-size: 1.75rem;
    line-height: 1;
    letter-spacing: -0.02em;
    font-variation-settings: 'opsz' 144;
  }
  .marchio svg { display: block; width: 2.1rem; height: 2.1rem; }
  .marchio b, h1 b { font-weight: inherit; color: var(--accent-text); }
  .pillola {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    width: fit-content;
    padding: 0.3rem 0.75rem 0.3rem 0.6rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.02em;
  }
  .pillola::before {
    content: '';
    width: 0.5rem;
    height: 0.5rem;
    border-radius: 50%;
    background: var(--vivo);
    box-shadow: 0 0 0 3px rgb(47 158 91 / 0.18);
  }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 340;
    font-size: clamp(2.5rem, 1.4rem + 5vw, 4rem);
    line-height: 0.98;
    letter-spacing: -0.02em;
    font-variation-settings: 'opsz' 144;
  }
  p { margin: 0; color: var(--muted); max-width: 44ch; }
  .tasto {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    min-height: 3.5rem;
    padding: 0.5rem 1.5rem;
    border: 1px solid var(--accent);
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-weight: 540;
    text-decoration: none;
    transition: transform 0.36s var(--silk), box-shadow 0.36s var(--silk);
  }
  .tasto svg { width: 1.2rem; height: 1.2rem; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.36s var(--silk); }
  @media (hover: hover) {
    .tasto:hover { transform: translateY(-2px); box-shadow: 0 1rem 2rem -1rem var(--glow), 0 0.35rem 0.9rem -0.5rem rgb(0 0 0 / 0.25); }
    .tasto:hover svg { transform: translateX(3px); }
  }
  .tasto:active { transform: scale(0.97); }
  .tasto:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 3px; }
  .piede {
    display: grid;
    gap: 0.2rem;
    padding-top: 1.1rem;
    border-top: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 0.75rem;
    line-height: 1.5;
    letter-spacing: 0.02em;
    color: var(--muted);
    max-width: none;
  }
</style>
</head>
<body>
<main>
  <div class="marchio">
    <svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="116" fill="#007acc"/><path d="M142 256H370A114 114 0 1 0 329.3 343.3" fill="none" stroke="#faf9f5" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span><b>e</b>-vision</span>
  </div>
  <span class="pillola">Accesso riservato</span>
  <h1>Le telecamere, <b>in diretta</b>.</h1>
  <p>Otto telecamere dal vivo, sul server di casa. Dal telefono si aggiunge alla schermata Home e si apre a tutto schermo, come un&rsquo;app.</p>
  <a class="tasto" href="https://desktop-inpvhr2.tail6c90b3.ts.net/telecamere/" target="_blank" rel="noopener noreferrer">
    Apri e-vision
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m0 0l-6-6m6 6l-6 6"/></svg>
  </a>
  <p class="piede">
    <span>HTTPS e password</span>
    <span>Se non hai la password, chiedila a pzkko.</span>
  </p>
</main>
</body>
</html>
