<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Telecamere &mdash; pzkko</title>
<style>
  :root {
    --bg: #07090b;
    --line: #1c232c;
    --text: #e7edf5;
    --muted: #8a96a5;
    --green: #ccff00;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 700px at 50% -10%, rgba(157, 0, 255, .22), transparent 60%),
      radial-gradient(900px 500px at 80% 110%, rgba(204, 255, 0, .10), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Bahnschrift", "Segoe UI", system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .card {
    width: min(92vw, 560px);
    background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.01));
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 30px 28px 26px;
    box-shadow: 0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
    text-align: center;
  }
  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: .18em;
    color: var(--green);
    text-transform: uppercase;
  }
  .kicker::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 12px var(--green);
  }
  h1 {
    margin: 14px 0 8px;
    font-size: clamp(30px, 6vw, 46px);
    line-height: 1;
    letter-spacing: -.02em;
  }
  p {
    margin: 0 auto 22px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
    max-width: 42ch;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 15px 18px;
    border-radius: 12px;
    background: var(--green);
    color: #0a0d06;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .02em;
    box-shadow: 0 10px 30px rgba(204, 255, 0, .18);
    transition: transform .15s, box-shadow .15s;
  }
  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 14px 36px rgba(204, 255, 0, .26);
  }
  .btn svg { width: 18px; height: 18px; }
  .lock {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
    font-size: 11px;
    color: #9aa6b4;
  }
  .lock svg { width: 13px; height: 13px; }
  .hint {
    margin: 16px 0 0;
    font-size: 11.5px;
    color: #67707c;
  }
</style>
</head>
<body>
<main class="card">
  <div class="kicker">pzkko &middot; accesso riservato</div>
  <h1>Telecamere</h1>
  <p>Le 8 telecamere in diretta. La pagina si apre sul server di casa, protetta da password.</p>
  <a class="btn" href="https://desktop-inpvhr2.tail6c90b3.ts.net/telecamere/" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.5"/>
    </svg>
    Apri le telecamere
  </a>
  <div class="lock">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/>
    </svg>
    HTTPS + password
  </div>
  <p class="hint">Se non hai la password, chiedila ad Alberto.</p>
</main>
</body>
</html>
